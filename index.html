const RP={on:false,i:0,play:false,t:null,saved:null};
function frameNow(){
  return{t:G.turn,cur:G.cur,b:V.filter(v=>v.b).map(v=>[v.id,v.b.owner,v.b.type]),r:E.filter(e=>e.owner!==null).map(e=>[e.id,e.owner,e.kind]),rob:G.robber,vp:G.players.map(p=>vp(p.id,true))};
}
function replayStart(){
  if(!G.over||!G.frames||G.frames.length<2){showToast('Repetición','No hay suficientes turnos para reproducir.');return;}
  closeModal();
  RP.saved={Vb:V.map(v=>v.b),Eo:E.map(e=>[e.owner,e.kind]),rob:G.robber};
  RP.on=true;RP.i=0;RP.play=true;
  clearInterval(RP.t);RP.t=setInterval(replayTick,900);
  const el=$('#rpbar');
  el.innerHTML=`<div class="lbl" id="rp-lbl" aria-live="polite"></div><button class="btn" onclick="replayGo(0)" aria-label="Al inicio">⏮</button><button class="btn" onclick="replayGo(RP.i-1)" aria-label="Turno anterior">◀</button><button class="btn primary" id="rp-play" onclick="replayToggle()">Pausa</button><button class="btn" onclick="replayGo(RP.i+1)" aria-label="Turno siguiente">▶</button><button class="btn" onclick="replayGo(G.frames.length-1)" aria-label="Al final">⏭</button><input id="rp-rng" type="range" min="0" max="${G.frames.length-1}" value="0" oninput="replayGo(+this.value)" aria-label="Turno de la repetición"><button class="btn" onclick="replayStop()">Cerrar</button>`;
  el.classList.add('on');
  replayApply();
}
function replayApply(){
  const f=G.frames[RP.i];if(!f)return;
  V.forEach(v=>{v.b=null;});f.b.forEach(([id,o,t])=>{V[id].b={owner:o,type:t};});
  E.forEach(e=>{e.owner=null;e.kind=null;});f.r.forEach(([id,o,k])=>{E[id].owner=o;E[id].kind=k;});
  G.robber=f.rob;G.pumaPrev=null;G.fresh=null;
  renderBoard();
  const l=$('#rp-lbl'),r=$('#rp-rng'),p=$('#rp-play');
  if(l)l.textContent=(f.t===0?'Inicio (colocación de pueblos)':`Turno ${f.t} · jugó ${G.players[f.cur]?G.players[f.cur].name:''}`)+' · '+f.vp.map((v,i)=>`${SYM[i]} ${G.players[i].name} ${v}`).join(' · ');
  if(r)r.value=RP.i;
  if(p)p.textContent=RP.play?'Pausa':'Reproducir';
}
function replayTick(){if(!RP.play)return;if(RP.i>=G.frames.length-1){RP.play=false;replayApply();return;}RP.i++;replayApply();}
function replayGo(i){RP.play=false;RP.i=Math.max(0,Math.min(G.frames.length-1,i));replayApply();}
function replayToggle(){if(RP.i>=G.frames.length-1)RP.i=0;RP.play=!RP.play;replayApply();}
function replayStop(){
  clearInterval(RP.t);RP.t=null;RP.on=false;RP.play=false;
  if(RP.saved){V.forEach((v,i)=>{v.b=RP.saved.Vb[i];});E.forEach((e,i)=>{e.owner=RP.saved.Eo[i][0];e.kind=RP.saved.Eo[i][1];});G.robber=RP.saved.rob;RP.saved=null;}
  G.pumaPrev=null;const el=$('#rpbar');el.classList.remove('on');el.innerHTML='';render();
}
function replayLast(){
  const t=LS.raw(LASTKEY);if(!t)return;
  try{loadSerial(t);}catch(e){showToast('No se pudo cargar','La repetición está dañada.');return;}
  G.over=true;closeModal();render();replayStart();
}

function trBuild(){
  if(TR.ready)return;TR.ready=true;
  const low=x=>x.charAt(0).toLowerCase()+x.slice(1),up=x=>x.charAt(0).toUpperCase()+x.slice(1);
  const rows=I18N_RAW.split('\n').map(l=>l.split('|')).filter(a=>a.length===3&&a[0].trim());
  ['en','pt'].forEach((lg,li)=>{
    const m=TR.map[lg];
    for(const a of rows){const k=a[0].trim(),v=a[li+1].trim();if(!v)continue;
      if(k.charAt(0)==='='){TR.ex[lg][k.slice(1)]=v;continue;}
      if(m[k]===undefined)m[k]=v;
      const kl=low(k),ku=up(k);
      if(kl!==k&&m[kl]===undefined)m[kl]=low(v);
      if(ku!==k&&m[ku]===undefined)m[ku]=up(v);}
    const keys=Object.keys(m).sort((x,y)=>y.length-x.length);
    const esc=x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    const parts=keys.map(k=>(/^\p{L}/u.test(k)?'(?<![\\p{L}])':'')+esc(k)+(/\p{L}$/u.test(k)?'(?![\\p{L}])':''));
    TR.re[lg]=new RegExp(parts.join('|'),'gu');
  });

class NetOrd{
  constructor(fn,gap){this.fn=fn;this.gap=gap;this.exp=null;this.buf=new Map();this.tm=null;}
  push(m){
    if(m.q==null){this.fn(m);return;}

    if(this.buf.size&&!this.tm){this.tm=setTimeout(()=>{this.tm=null;if(this.buf.size){this.exp=Math.min(...this.buf.keys());if(this.gap)this.gap();this.flush();}},350);}

  }
  stop(){clearTimeout(this.tm);this.tm=null;this.buf.clear();}
}

  async imp(str){const [x,y]=String(str).split('.');return crypto.subtle.importKey('jwk',{kty:'EC',crv:'P-256',x,y,ext:true},{name:'ECDH',namedCurve:'P-256'},false,[]);},
  async key(priv,pubStr){return crypto.subtle.deriveKey({name:'ECDH',public:await CX.imp(pubStr)},priv,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);},
  async fp(pubStr){const h=new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(String(pubStr))));return 'k'+CX.b64(h.slice(0,15));},
  async enc(key,obj){const iv=crypto.getRandomValues(new Uint8Array(12));const c=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(obj))));return{iv:CX.b64(iv),c:CX.b64(c)};},
  async dec(key,iv,c){try{return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:CX.unb64(iv)},key,CX.unb64(c))));}catch(e){return null;}},
  async ident(){ // identidad del dispositivo: par de claves guardado localmente
    let jwk=null;try{jwk=JSON.parse(localStorage.getItem('ta-idk')||'null');}catch(e){}
    let priv=null;
    if(jwk&&jwk.d&&jwk.x&&jwk.y){try{priv=await crypto.subtle.importKey('jwk',jwk,{name:'ECDH',namedCurve:'P-256'},true,['deriveKey']);}catch(e){priv=null;}}
    if(!priv){const kp=await CX.gen();priv=kp.privateKey;jwk=await crypto.subtle.exportKey('jwk',priv);try{localStorage.setItem('ta-idk',JSON.stringify({kty:jwk.kty,crv:jwk.crv,x:jwk.x,y:jwk.y,d:jwk.d}));}catch(e){}}
    const pub=jwk.x+'.'+jwk.y;return{priv,pub,id:await CX.fp(pub)};
  }
};
const NETENC=['view','modal','mclose','snap','end'];
const netSend=m=>{
  if(NET.role==='host'){m.h=1;m.q=++NET.seq;
    if(NET.hpriv&&m.to!=null&&typeof m.to==='number'&&NETENC.includes(m.t)){
      const r=NET.roster.find(x=>x.seat===m.to),k=r&&NET.keys[r.id];
      if(k){const tp=NET.tp,o={h:1,q:m.q,t:'enc',to:m.to};
        CX.enc(k,m).then(e=>{o.iv=e.iv;o.c=e.c;if(tp)tp.send(o);}).catch(()=>{});return;}
    }
  }else if(NET.role==='guest'){
    if(m.t==='call'||m.t==='mclick'||m.t==='minput')m.q=++NET.gseq;
    if(m.t==='hello'&&NET.cx)m.pk=NET.cx.pub;
    else if(NET.cx&&NET.key){const tp=NET.tp,o={t:'enc',tg:netTag(NET.id,NET.code)};if(m.q!=null)o.q=m.q;
      CX.enc(NET.key,m).then(e=>{o.iv=e.iv;o.c=e.c;if(tp)tp.send(o);}).catch(()=>{});return;}
  }
  if(NET.tp)NET.tp.send(m);
};
const netSeatOf=id=>{const r=NET.roster.find(x=>x.id===id);return r?r.seat:-1;};

/* ---------- ganchos que usa el motor (NETH) ---------- */
const NETH={
  as(seat,fn){ // ejecuta fn «como» ese asiento (para ventanas y acciones de invitados)
    if(!NET.role||seat==null||seat===G.cfg.humanSeat)return fn();
    const sv=G.cfg.humanSeat;G.cfg.humanSeat=seat>=10?-1:seat; // los espectadores miran sin ver manos
    try{return fn();}finally{G.cfg.humanSeat=sv;}
  },
  touch(){
    if(NET.role!=='host'||!NET.started)return;
    if(NET.tm)return;
    NET.tm=setTimeout(()=>{NET.tm=null;netPush();},110);
  },
  sfx(name,vol){if(NET.role==='host'&&NET.started)netSend({t:'sfx',n:name,v:vol});},
  modalOpen(){
    if(NET.role!=='host')return;
    const seat=G.cfg.humanSeat;
    if(seat!==NET.hs&&NET.remote[seat]){
      if(NET.modalSeat!=null&&NET.modalSeat!==seat)netSend({t:'mclose',to:NET.modalSeat});
      NET.modalSeat=seat;$('#modal').classList.add('remote');netSendModal(true);
    }else{
      if(NET.modalSeat!=null)netSend({t:'mclose',to:NET.modalSeat});
      NET.modalSeat=null;$('#modal').classList.remove('remote');
    }
  },
  modalClose(){
    if(NET.role==='host'&&NET.modalSeat!=null){netSend({t:'mclose',to:NET.modalSeat});NET.modalSeat=null;NET.lastModal='';}
  },
  pending(){ // al empezar cada turno: reincorpora a quienes volvieron
    if(NET.role!=='host'||!G.cfg.humans)return;
    for(const id in NET.back){const r=NET.roster.find(x=>x.id===id);if(r&&NET.back[id]){NET.back[id]=false;
      if(!G.cfg.humans.includes(r.seat)){G.cfg.humans.push(r.seat);NET.remote[r.seat]=true;say(`${r.name} volvió a la partida.`);}}}
  },
  end(){if(NET.role==='host'&&NET.started)netEnd();},
  snap(){if(NET.role==='host'&&NET.started)netSnap();},
  starting(cfg){ // el formulario «Partida rápida» en modo sala
    if(NET.role!=='host'||!NET.lobby)return false;
    const hs=NET.roster.slice(0,NETMAX),nb=Math.max(0,Math.min(+cfg.bots,NETMAX-hs.length));
    if(hs.length+nb<2){showToast('Sala','Agrega al menos un rival o espera a otro jugador.');return true;}
    cfg.humanNames=hs.map(r=>r.name);cfg.bots=nb;cfg.spectate=false;
    const dfs=(cfg.diff||[]);cfg.diff=[...Array(hs.length).fill('normal'),...dfs.slice(1,1+nb)];
    cfg.limits=null;
    hs.forEach((r,i)=>{r.seat=i;});
    NET.lobby=false;NET.started=true;NET.remote={};hs.forEach(r=>{if(r.seat>0)NET.remote[r.seat]=true;});
    NET.roster=hs;NET.last={};
    netSend({t:'start',roster:netRoster(),hk:NET.hpub||undefined});
    NETT.setStatus(NET.code,'playing');
    launch(cfg);
    return true;
  },
  styleStart(){
    if(NET.role!=='host'||!NET.lobby)return;
    for(const id of ['c-name','c-spec','r-tut']){const e=$('#'+id);const f=e&&e.closest('.field,label.chk');if(f)f.style.display='none';}
    const sel=$('#c-bots');
    if(sel){const mx=Math.max(0,NETMAX-NET.roster.length);sel.innerHTML=Array.from({length:mx+1},(_,i)=>`<option value="${i}">${i===0?'Sin rivales de la IA':i+' rival'+(i>1?'es':'')+' de la IA'}</option>`).join('');sel.value=String(Math.max(0,Math.min(mx,4-NET.roster.length)));try{rowsChanged();}catch(e){}}
  },
  autoJoin(){
    let code=null,saved=null;
    try{code=(new URLSearchParams(location.search).get('sala')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8);}catch(e){}
    try{saved=JSON.parse(sessionStorage.getItem('ta-net')||'null');}catch(e){}
    if(saved&&saved.role==='guest'&&saved.code&&(!code||code===saved.code)){showNetMenu(saved.code,saved);return true;}
    if(code){showNetMenu(code);return true;}
    return false;
  }
};

/* ---------- anfitrión ---------- */
const netRoster=()=>NET.roster.map(r=>({tag:netTag(r.id,NET.code),name:r.name,seat:r.seat,online:r.online}));
const netPlayers=()=>NET.roster.filter(r=>!r.spec);
function netLobbyCast(){netSend({t:'lobby',roster:netRoster(),started:NET.started,hk:NET.hpub||undefined});netListPush();}
/* sala pública: aparece en la lista de «Salas abiertas» mientras está en la antesala */
function netListPush(){
  if(NET.role!=='host'||!NETT.setList)return;
  const on=!!NET.pub&&!!NET.lobby&&!NET.started;
  NET.lpt=Date.now();
  if(!on&&!NET.pubSent)return;
  NET.pubSent=on;
  NETT.setList(NET.code,{pub:on,host_name:String(NET.name||'').slice(0,14),n:Math.min(6,netPlayers().length),mx:NETMAX});
}
function netSetPub(v){NET.pub=!!v;NET.pubSent=true;netListPush();}
/* expulsar (anfitrión) y reemplazo por votación */
function netKick(id){
  if(NET.role!=='host')return;
  const r=NET.roster.find(x=>x.id===id);if(!r||r.seat===NET.hs)return;
  NET.ban[id]=true;
  netSend({t:'reject',to:netTag(id,NET.code),why:'El anfitrión te sacó de la sala.'});
  if(r.spec){NET.roster=NET.roster.filter(x=>x.id!==id);}
  else if(NET.started){netSeatOffline(r,'fue expulsado');NET.roster=NET.roster.filter(x=>x.id!==id||true);}
  else{NET.roster=NET.roster.filter(x=>x.id!==id);NET.roster.forEach((x,i)=>{x.seat=i;});}
  if(NET.started)NET.last={};
  netLobbyCast();if(NET.started)netPush(true);else if(NET.inLobby)showLobby();
  if(NET.started&&!$('#modal').classList.contains('remote'))showRoomMenu();
}
function netStaleCalc(){
  const now=Date.now(),out=[],hum=G.cfg&&G.cfg.humans||[];
  const live=NET.roster.filter(x=>!x.spec&&hum.includes(x.seat)&&x.online);
  for(const r of live){
    if(r.seat===NET.hs||now-(NET.seen[r.id]||0)<=NET.staleMs){delete NET.votes[r.seat];continue;}
    const v=NET.votes[r.seat]||(NET.votes[r.seat]={}),eligible=live.filter(x=>x.id!==r.id).length;
    for(const id in v)if(!live.some(x=>x.id===id))delete v[id];
    out.push({s:r.seat,n:String(r.name).slice(0,14),v:Object.keys(v).length,k:Math.floor(eligible/2)+1});
  }
  return out;
}
function netHostVote(r,seat){
  if(NET.role!=='host'||!NET.started||G.over||!r||r.spec||!G.cfg.humans.includes(r.seat))return;
  const t=NET.roster.find(x=>!x.spec&&x.seat===seat);if(!t||t.id===r.id||t.seat===NET.hs)return;
  const st=netStaleCalc().find(x=>x.s===seat);if(!st)return;
  (NET.votes[seat]||(NET.votes[seat]={}))[r.id]=1;
  if(Object.keys(NET.votes[seat]).length>=st.k){delete NET.votes[seat];netSeatOffline(t,'fue reemplazado por votación del grupo');netPush(true);}
  netStaleShow(netStaleCalc());
}
function netVote(seat){
  if(NET.role==='host')netHostVote(NET.roster.find(r=>r.seat===NET.hs),+seat);
  else if(NET.role==='guest')netSend({t:'vote',id:NET.id,seat:+seat});
}
function netStaleShow(list){
  let b=$('#stalebar');
  list=(Array.isArray(list)?list:[]).slice(0,5).map(x=>({s:+x.s||0,n:String(x&&x.n||'').replace(/[<>&"']/g,'').slice(0,14),v:+x.v||0,k:+x.k||1})).filter(x=>x.s!==NET.seat&&!(NET.role==='host'&&x.s===NET.hs));
  if(!list.length){if(b)b.remove();return;}
  if(!b){b=document.createElement('div');b.id='stalebar';b.setAttribute('role','status');document.body.append(b);}
  b.textContent='';
  for(const x of list){
    const row=document.createElement('div');row.className='sb';
    const t=document.createElement('span');t.textContent=x.n+' no responde.';
    const bt=document.createElement('button');bt.type='button';bt.className='btn';bt.textContent='Reemplazar por bot ('+x.v+'/'+x.k+')';
    bt.onclick=()=>netVote(x.s);
    row.append(t,bt);
    if(NET.role==='host'){const ro=NET.roster.find(r=>r.seat===x.s);if(ro){const kb=document.createElement('button');kb.type='button';kb.className='btn';kb.textContent='Expulsar';kb.onclick=()=>netKick(ro.id);row.append(kb);}}
    b.append(row);
  }
}

async function netCreate(name){
  name=(name||'').trim().slice(0,14)||'Anfitrión';
  try{localStorage.setItem('ta-name',name);}catch(e){}
  let code=null;
  for(let i=0;i<6;i++){const c=NETCODE();try{if(await NETT.create(c)){code=c;break;}}catch(e){showNetMenu(null,null,'No se pudo conectar con el servidor de salas.');return;}}
  if(!code){showNetMenu(null,null,'No se pudo crear la sala. Intenta de nuevo.');return;}
  Object.assign(NET,{role:'host',hs:0,snap:null,code,id:NETID(),name,roster:[],remote:{},started:false,lobby:true,last:{},seen:{},back:{},bye:false,ended:false});
  NET.roster=[{id:NET.id,name,seat:0,online:true}];
  NET.keys={};NET.pks={};NET.dq={};NET.hpriv=null;NET.hpub='';
  if(CX.ok()){try{const kp=await CX.gen();NET.hpriv=kp.privateKey;NET.hpub=await CX.pub(kp.publicKey);}catch(e){}}
  try{NET.tp=await NETT.open(code,netHostIn);}catch(e){NET.role=null;showNetMenu(null,null,'No se pudo abrir la sala en tiempo real.');return;}
  netSave();gidSet(code,NET.id);
  NET.hb=setInterval(netHostBeat,NET.beatMs);
  showLobby();
}
function netHostIn(m){
  if(m&&m.h&&m.t==='takeover'&&NET.role==='host'&&m.id!==NET.id){netYield();return;}
  if(!m||m.h||NET.role!=='host')return;
  if(NET.hpriv){
    if(m.t==='hello'){ // el invitado demuestra su identidad con su clave pública (id = huella de la clave)
      if(typeof m.pk!=='string'||m.pk.length>200||typeof m.id!=='string'){if(typeof m.id==='string')netSend({t:'reject',to:netTag(m.id,NET.code),why:'Actualiza la página para entrar a esta sala.'});return;}
      CX.fp(m.pk).then(async fp=>{
        if(fp!==m.id||NET.role!=='host')return;
        if(!NET.keys[m.id]||NET.pks[m.id]!==m.pk){NET.keys[m.id]=await CX.key(NET.hpriv,m.pk);NET.pks[m.id]=m.pk;}
        netHostIn2(m);
      }).catch(()=>{});return;
    }
    if(m.t==='enc'){
      const r=NET.roster.find(x=>netTag(x.id,NET.code)===m.tg),k=r&&NET.keys[r.id];if(!r||!k||typeof m.iv!=='string'||typeof m.c!=='string')return;
      const id=r.id,run=mm=>{NET.dq[id]=(NET.dq[id]||Promise.resolve()).then(async()=>{const k2=NET.keys[id];if(!k2||typeof mm.iv!=='string'||typeof mm.c!=='string')return;const x=await CX.dec(k2,mm.iv,mm.c);if(x&&typeof x==='object'&&NET.role==='host'){x.id=id;x.q=null;netHostMsg(x);}}).catch(()=>{});};
      if(m.q!=null){const o=NET.ords[id]||(NET.ords[id]=new NetOrd(run,()=>{}));o.push(m);}else run(m);
      return;
    }
    return; // con cifrado activo, todo lo demás se ignora
  }
  netHostIn2(m);
}
function netHostIn2(m){
  if(!m||m.h||NET.role!=='host')return;
  if(m.t==='hello'&&m.id){if(NET.ords[m.id])NET.ords[m.id].stop();delete NET.ords[m.id];}
  if(m.q!=null&&m.id){const o=NET.ords[m.id]||(NET.ords[m.id]=new NetOrd(netHostMsg,()=>{}));o.push(m);}
  else netHostMsg(m);
}
function netHostMsg(m){
  if(!m||m.h||NET.role!=='host')return;
  const r=m.id?NET.roster.find(x=>x.id===m.id):null;
  if(r)NET.seen[r.id]=Date.now();
  if(m.t==='hello'&&m.id&&NET.ban[m.id]){netSend({t:'reject',to:netTag(m.id,NET.code),why:'El anfitrión te sacó de esta sala.'});return;}
  if(m.t==='hello'){
    if(r){r.online=true;r.name=r.name||m.name;
      if(NET.started){NET.last={};if(!r.spec&&G.cfg.humans&&!G.cfg.humans.includes(r.seat)){NET.back[r.id]=true;if(G.cur!==r.seat)NETH.pending();}}
      netLobbyCast();if(NET.started)netPush(true);else if(NET.inLobby)showLobby();return;}
    if(NET.started){ // la partida ya empezó: entra como espectador
      const ns=NET.roster.filter(x=>x.spec);
      if(ns.length>=8){netSend({t:'reject',to:netTag(m.id,NET.code),why:'La sala ya tiene demasiados espectadores.'});return;}
      let k=10;while(NET.roster.some(x=>x.seat===k))k++;
      NET.roster.push({id:m.id,name:String(m.name||'Espectador').replace(/[<>&"]/g,'').slice(0,14),seat:k,online:true,spec:true});
      NET.seen[m.id]=Date.now();NET.last={};netLobbyCast();netPush(true);return;
    }
    if(netPlayers().length>=NETMAX){netSend({t:'reject',to:netTag(m.id,NET.code),why:'La sala está llena.'});return;}
    NET.roster.push({id:m.id,name:String(m.name||'Jugador').replace(/[<>&"]/g,'').slice(0,14),seat:NET.roster.length,online:true});
    NET.seen[m.id]=Date.now();netLobbyCast();if(NET.inLobby)showLobby();return;
  }
  if(!r)return;
  if(m.t==='ping')return;
  if(m.t==='chat'){const n=NET.cht||(NET.cht={});if(Date.now()-(n[r.id]||0)<600)return;n[r.id]=Date.now();const tx=netChatClean(m.text);if(tx)netChatCast(r.seat,r.name,tx);return;}
  if(m.t==='leave'){
    if(r.spec){NET.roster=NET.roster.filter(x=>x.id!==r.id);netLobbyCast();return;}
    if(NET.started){netSeatOffline(r,'salió de la sala');}
    else{NET.roster=NET.roster.filter(x=>x.id!==r.id);NET.roster.forEach((x,i)=>{x.seat=i;});netLobbyCast();if(NET.inLobby)showLobby();}
    return;
  }
  if(m.t==='vote'){netHostVote(r,+m.seat);return;}
  if(!NET.started||r.seat===NET.hs)return;
  if(m.t==='call')netExec(r.seat,m.s);
  else if(m.t==='mclick')netModalClick(r.seat,m.path);
  else if(m.t==='minput')netModalInput(r.seat,m.path,m.v);
}
function netHostBeat(){
  if(NET.role!=='host')return;
  const stl=NET.started?netStaleCalc():[];
  netSend(stl.length||NET.stale.length?{t:'hb',st:stl}:{t:'hb'});NET.stale=stl;netStaleShow(stl);
  const now=Date.now();
  if(NET.pub&&NET.lobby&&!NET.started&&now-NET.lpt>30000)netListPush();
  for(const r of NET.roster){
    if(r.seat===NET.hs)continue;
    if(r.spec&&now-(NET.seen[r.id]||0)>NET.offMs){NET.roster=NET.roster.filter(x=>x.id!==r.id);netLobbyCast();continue;}
    if(now-(NET.seen[r.id]||0)>NET.offMs){if(r.online){r.online=false;if(NET.started)netSeatOffline(r,'se desconectó');else{NET.roster=NET.roster.filter(x=>x.id!==r.id);NET.roster.forEach((x,i)=>{x.seat=i;});if(NET.inLobby)showLobby();}netLobbyCast();}}
  }
  if(NET.started)netRecover();
}

async function netPush(force){

  if(NET.busy){NET.dirty=true;return;}
  NET.busy=true;
  try{
    do{
      NET.dirty=false;

        if(force||v.b!==l.b){await netPackField(msg,'b',l.b,v.b,force);msg.vb=VB;l.b=v.b;}
        if(force||v.s!==l.s){await netPackField(msg,'s',l.s,v.s,force);l.s=v.s;}
        if(force||v.mb!==l.mb){msg.mb=v.mb;l.mb=v.mb;}
        if(force||v.m!==l.m){msg.m=v.m;l.m=v.m;}

async function netPackField(msg,k,old,nw,force){
  const d=(!force&&old)?netDiff(old,nw):null;
  msg[k+'n']=netHash(nw);
  if(d&&d[2].length<nw.length*0.4&&d[2].length<30000){ // parche: solo lo que cambió respecto a lo último enviado
    msg[k+'h']=netHash(old);msg[k+'p']=d[0];msg[k+'s']=d[1];
    if(d[2].length>500){const z=await netGz(d[2]);if(z)msg[k+'dz']=z;else msg[k+'i']=d[2];}else msg[k+'i']=d[2];
  }else if(nw.length>600){const z=await netGz(nw);if(z)msg[k+'z']=z;else msg[k]=nw;}
  else msg[k]=nw;
}
async function netUnpackField(m,k){ // devuelve el texto completo, o null si no se puede aplicar el parche
  if(m[k+'p']!=null){
    const g=NET['g'+k];
    if(typeof g!=='string'||netHash(g)!==m[k+'h']||!Number.isInteger(m[k+'p'])||!Number.isInteger(m[k+'s'])||m[k+'p']+m[k+'s']>g.length)return null;
    const ins=m[k+'dz']?await netGunz(m[k+'dz']):String(m[k+'i']||'');
    const h=g.slice(0,m[k+'p'])+ins+g.slice(g.length-m[k+'s']);
    return netHash(h)===m[k+'n']?h:null;
  }
  if(m[k+'z'])return await netGunz(m[k+'z']);
  return typeof m[k]==='string'?m[k]:undefined; // undefined: este campo no vino
}
function netHash(t){let h=5381;for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return h>>>0;}
function netDiff(a,b){
  const n=Math.min(a.length,b.length);let p=0;while(p<n&&a.charCodeAt(p)===b.charCodeAt(p))p++;
  let s=0;const m=n-p;while(s<m&&a.charCodeAt(a.length-1-s)===b.charCodeAt(b.length-1-s))s++;
  return [p,s,b.slice(p,b.length-s)];
}

async function netGuestHandle(m){

  openModal(`<h2>Sala ${NET.code}</h2><p>Comparte este código o el enlace con tus amigos. Pueden entrar desde el computador o el teléfono.</p>
   <div style="font:800 34px/1 var(--display,inherit);letter-spacing:.18em;text-align:center;padding:10px 0">${NET.code}</div>
   <div class="mact" style="justify-content:center"><button class="btn" onclick="netCopy('${NET.code}')">Copiar código</button><button class="btn" onclick="netCopy('${link}')">Copiar enlace</button><button class="btn primary" onclick="netShare()">Invitar</button></div>
   <label class="chk" style="display:flex;gap:8px;align-items:center;margin:6px 0"><input type="checkbox" ${NET.pub?'checked':''} onchange="netSetPub(this.checked)"> Sala pública: aparece en «Salas abiertas» para unirse sin código</label>
   <h3 class="rh">Jugadores (${NET.roster.length} de ${NETMAX})</h3>${rosterHTML()}
   <p style="color:var(--muted);font-size:13px">Los asientos libres los ocupan rivales de la IA. Cuando estén todos, configura y empieza.</p>
   <div class="mact"><button class="btn" onclick="netLeave()">Cerrar sala</button><button class="btn primary" onclick="NET.inLobby=false;showStart()">Configurar e iniciar</button></div>`,true);
}
function showGuestLobby(){
  if(NET.role!=='guest'||NET.started)return;
  clearInterval(NET.hello);
  netGuestModal(`<h2>Sala ${NET.code}</h2><p>Estás dentro. Esperando a que el anfitrión inicie la partida.</p>${rosterHTML()}<div class="mact"><button class="btn" data-local="netLeave()">Salir de la sala</button></div>`);
}
function showRoomMenu(){
  const host=NET.role==='host';
  const kicks=host?NET.roster.filter(r=>r.seat!==NET.hs&&(r.spec||(G.cfg.humans||[]).includes(r.seat))).map(r=>`<div class="mact" style="justify-content:space-between;align-items:center"><span>${netEsc(r.name)}${r.spec?' (espectador)':''}</span><button class="btn" onclick="netKick('${netEsc(r.id)}')">Expulsar</button></div>`).join(''):'';
  openModal(`<h2>Sala ${NET.code}</h2>${kicks?'<h3 class="rh">Expulsar a alguien</h3>'+kicks:''}<p>${host?'Eres el anfitrión: si sales, la partida termina para todos.':'Si sales, un rival de la IA jugará por tu asiento.'}</p><div class="mact"><button class="btn" onclick="closeModal()">Volver a la partida</button><button class="btn primary" onclick="netLeave()">${host?'Cerrar la sala':'Salir de la sala'}</button></div>`);
  if(NET.role==='guest')$('#modal').innerHTML=netNeut($('#modal').innerHTML);
}

/* Los clics de un invitado se reenvían al anfitrión (tablero, panel y ventanas). */
document.addEventListener('click',e=>{
  if(NET.role!=='guest')return;
  const loc=e.target.closest&&e.target.closest('[data-local]');
  if(loc){e.preventDefault();e.stopPropagation();const f=/^(netLeave|netTakeOver)\(\)$/.exec(loc.dataset.local);if(f&&window[f[1]])window[f[1]]();return;}
  if(!NET.started)return;
  const inModal=e.target.closest&&e.target.closest('#modal');
  const oc=e.target.closest&&e.target.closest('[data-oc]');
  if(oc&&oc.dataset.oc){
    if(/^(showMenu|showRules|toggleSound|toggleMusic|setVol|setMVol|setPalette|zoomBy|zoomReset|tutHeader)\(/.test(oc.dataset.oc)||/scrollIntoView/.test(oc.dataset.oc)){
      if(/scrollIntoView/.test(oc.dataset.oc)){e.preventDefault();e.stopPropagation();const sb=document.querySelector('#sec-build');if(sb)sb.scrollIntoView({behavior:'smooth',block:'center'});}
      return;}
    e.preventDefault();e.stopPropagation();
    netSend({t:'call',id:NET.id,s:oc.dataset.oc});return;
  }
  if(inModal){
    const b=e.target.closest('button,[role=button],.chip');
    if(!b||b.disabled)return;
    const path=[];let el=b;const root=$('#modal');
    while(el&&el!==root){const p=el.parentElement;if(!p)return;path.unshift([...p.children].indexOf(el));el=p;}
    e.preventDefault();e.stopPropagation();netSend({t:'mclick',id:NET.id,path});
  }
},true);
document.addEventListener('input',e=>{
  if(NET.role!=='guest'||!NET.started||!e.target.closest||!e.target.closest('#modal'))return;
  const t=e.target;if(!('value' in t))return;
  const path=[];let el=t;const root=$('#modal');
  while(el&&el!==root){const p=el.parentElement;if(!p)return;path.unshift([...p.children].indexOf(el));el=p;}
  netSend({t:'minput',id:NET.id,path,v:t.value});
},true);
/* ---------- chat, reacciones y aviso de turno (solo en línea) ---------- */
const CHAT={log:[],unread:0,wasMine:false,sent:0,quick:['👍','🙌','😮','😂','😡','⏰ ¡Apúrate!','¡Buen golpe!','Gracias','Buena suerte'],title:document.title};
function chatInit(){
  if($('#chatbtn'))return;
  const mk=(t,id,c)=>{const e=document.createElement(t);if(id)e.id=id;if(c)e.className=c;return e;};
  const btn=mk('button','chatbtn');btn.type='button';btn.setAttribute('aria-label','Chat de la sala');btn.append('💬');const bd=mk('span',null,'bd');bd.id='chatbd';btn.append(bd);
  btn.onclick=()=>chatToggle();document.body.append(btn);
  const rb=mk('div','reactbar');rb.setAttribute('role','group');rb.setAttribute('aria-label','Reacciones');
  REACT.slice(0,4).forEach(w=>{const b=mk('button',null,'rb');b.type='button';b.textContent=w;b.setAttribute('aria-label','Reacción '+w);b.onclick=()=>{netChatSend(w);reactOpen(false);};rb.append(b);});
  document.body.append(rb);
  const rt=mk('button','reactbtn');rt.type='button';rt.setAttribute('aria-label','Reacciones rápidas');rt.textContent='😊';rt.onclick=()=>reactOpen();document.body.append(rt);
  document.body.append(mk('div','chatfeed'));
  const pn=mk('div','chatpanel');pn.setAttribute('role','dialog');pn.setAttribute('aria-label','Chat de la sala');
  const h=mk('div',null,'ch');const t=mk('h3');t.textContent='Chat de la sala';const x=mk('button',null,'btn');x.type='button';x.textContent='Cerrar';x.onclick=()=>chatToggle(false);h.append(t,x);
  const l=mk('div','chatlist','cl');l.setAttribute('aria-live','polite');
  const q=mk('div',null,'cq');CHAT.quick.forEach(w=>{const b=mk('button',null,'btn');b.type='button';b.textContent=w;b.onclick=()=>netChatSend(w);q.append(b);});
  const r=mk('div',null,'cr');const i=mk('input','chatin');i.type='text';i.maxLength=80;i.placeholder='Escribe un mensaje…';i.setAttribute('aria-label','Mensaje');
  const sd=mk('button',null,'btn primary');sd.type='button';sd.textContent='Enviar';
  const go=()=>{const v=i.value.trim();if(v){netChatSend(v);i.value='';}};sd.onclick=go;i.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();go();}};
  r.append(i,sd);pn.append(h,l,q,r);document.body.append(pn);
}
function chatSync(){
  const on=!!NET.role&&OPT.chat;
  if(on)chatInit();
  const b=$('#chatbtn');if(b)b.classList.toggle('on',on);
  const rbar=$('#reactbar');if(rbar){rbar.classList.toggle('on',on);if(!on)rbar.classList.remove('open');}
  const rbt=$('#reactbtn');if(rbt)rbt.classList.toggle('on',on);
  if(!on){const p=$('#chatpanel');if(p)p.classList.remove('on');const f=$('#chatfeed');if(f)f.textContent='';CHAT.log=[];CHAT.unread=0;CHAT.wasMine=false;}
}
let REACTT=0;
function reactOpen(f){const r=$('#reactbar');if(!r)return;const on=f==null?!r.classList.contains('open'):f;r.classList.toggle('open',on);clearTimeout(REACTT);if(on)REACTT=setTimeout(()=>r.classList.remove('open'),5000);}
function chatToggle(f){
  const p=$('#chatpanel');if(!p)return;
  const on=f==null?!p.classList.contains('on'):f;p.classList.toggle('on',on);
  if(on){CHAT.unread=0;chatBadge();chatRender();const l=$('#chatlist');l.scrollTop=l.scrollHeight;setTimeout(()=>{try{$('#chatin').focus();}catch(e){}},50);}
}
function chatBadge(){const b=$('#chatbd');if(!b)return;b.textContent=CHAT.unread>9?'9+':String(CHAT.unread);b.classList.toggle('on',CHAT.unread>0);}
function chatRender(){
  const l=$('#chatlist');if(!l)return;l.textContent='';
  for(const m of CHAT.log){const d=document.createElement('div');d.className='cm';const b=document.createElement('b');b.textContent=m.name;b.style.color=PCOL[m.seat]||'#ccc';d.append(b,document.createTextNode(m.text));l.append(d);}
  l.scrollTop=l.scrollHeight;
}
const REACT=['👍','🙌','😮','😂','😡'];
function reactFx(seat,name,emoji){
  const d=document.createElement('div');d.className='rfx';d.setAttribute('aria-hidden','true');
  d.style.left=(18+Math.random()*64)+'%';
  const e=document.createElement('span');e.textContent=emoji;const n=document.createElement('small');n.textContent=name;n.style.color=PCOL[seat]||'#ddd';
  d.append(e,n);document.body.append(d);setTimeout(()=>{try{d.remove();}catch(x){}},2200);
}
function chatShow(seat,name,text){
  if(!OPT.chat)return;
  if(REACT.includes(text)){reactFx(seat,name,text);return;}
  chatInit();
  CHAT.log.push({seat,name,text});if(CHAT.log.length>50)CHAT.log.shift();
  const open=$('#chatpanel').classList.contains('on');
  if(open)chatRender();
  else{CHAT.unread++;chatBadge();
    const f=$('#chatfeed'),d=document.createElement('div');d.className='ct';const b=document.createElement('b');b.textContent=name;b.style.color=PCOL[seat]||'#ccc';d.append(b,document.createTextNode(text));f.append(d);
    while(f.children.length>3)f.firstChild.remove();setTimeout(()=>{try{d.remove();}catch(e){}},6000);}
}
function netChatClean(t){return String(t==null?'':t).replace(/[\u0000-\u001f<>]/g,'').trim().slice(0,80);}
function netChatSend(text){
  const t=netChatClean(text);if(!t||!NET.role)return;
  if(Date.now()-CHAT.sent<700)return;CHAT.sent=Date.now();
  if(NET.role==='host')netChatCast(0,NET.name,t);
  else netSend({t:'chat',id:NET.id,text:t});
}
function netChatCast(seat,name,text){netSend({t:'chatmsg',seat,name,text});chatShow(seat,name,text);}
/* aviso cuando llega tu turno: vibración, sonido breve y título de la pestaña */
function sysNotify(title,body){
  try{
    if(!OPT.notif||!('Notification' in window)||Notification.permission!=='granted')return;
    const o={body:trStr(body),tag:'ta-turn',renotify:true,icon:'/icon-192.png',badge:'/icon-192.png'};
    if(navigator.serviceWorker&&navigator.serviceWorker.ready)navigator.serviceWorker.ready.then(r=>r.showNotification(trStr(title),o)).catch(()=>{try{new Notification(trStr(title),o);}catch(e){}});
    else new Notification(trStr(title),o);
  }catch(e){}
}
function turnAlert(mine){
  if(mine&&!CHAT.wasMine&&OPT.alert){
    try{if(OPT.vib&&navigator.vibrate)navigator.vibrate([140,70,140]);}catch(e){}
    try{const c=audio();if(c&&SFX.coin){SND.v=.6;SFX.coin(c,c.currentTime+.01);}}catch(e){}
    if(document.hidden){document.title='🔔 ¡Tu turno! · Tierra Austral';sysNotify('¡Tu turno!','Tierra Austral · sala '+(NET.code||''));}
  }
  CHAT.wasMine=!!mine;
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)document.title=CHAT.title;});
setInterval(chatSync,700);
setInterval(()=>{if(NET.role==='host'&&NET.started&&!G.over)turnAlert(G.cur===0&&!G.busy);},500);
setInterval(()=>{if(NET.role==='host'&&NET.started){netSendModal(false);if(G.rules.timer||NET.dirty)NETH.touch();}},1000);

/* ===================== Arranque ===================== */
newGame({name:'Tú',bots:3,speed:1,spectate:false});
G.msg='Abre el Menú para empezar.';
try{setPalette(localStorage.getItem('ta-cb')==='on',true);}catch(e){setPalette(false,true);}
updateSndUI();updateMusUI();
render();
setInterval(tick,250);
if(LANG!=='es'){TR.dirty=true;trAll();}
if(!NETH.autoJoin())showWelcome();

/* teclado en pantalla: el cuadro sube y el campo se queda a la vista (no se mueve ni se corta) */
(function(){
  const vv=window.visualViewport;
  const fit=()=>{const m=document.getElementById('modal');if(!m)return;document.documentElement.style.setProperty('--vvh',(vv?vv.height:innerHeight)+'px');if(vv&&m.classList.contains('kb')){m.style.top=vv.offsetTop+'px';m.style.bottom='auto';m.style.height=vv.height+'px';}};
  const isF=e=>e&&e.matches&&e.matches('input,textarea,select');
  document.addEventListener('focusin',e=>{const m=document.getElementById('modal');if(!m||!m.classList.contains('open')||!isF(e.target)||!m.contains(e.target))return;m.classList.add('kb');fit();setTimeout(()=>{fit();try{e.target.scrollIntoView({block:'center'});}catch(_){}},250);});
  document.addEventListener('focusout',e=>{const m=document.getElementById('modal');if(!m||!isF(e.target))return;setTimeout(()=>{if(isF(document.activeElement)&&m.contains(document.activeElement))return;m.classList.remove('kb');m.style.top=m.style.bottom=m.style.height='';},120);});
  if(vv){vv.addEventListener('resize',fit);vv.addEventListener('scroll',fit);}
})();
</script>
