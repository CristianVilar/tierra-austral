<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Mundo único y oscuro: costa austral, mar profundo, ámbar como acento.
   Disposición: tablero a la izquierda, panel de juego a la derecha. */
:root{
  --bg:#0d1a23; --panel:#15293a; --panel2:#1c3548; --line:#2b4659;
  --ink:#e8eef2; --muted:#8fa6b4; --accent:#f0b84a; --good:#7ed08a; --bad:#ef7b6c;
  --font-display:'Fraunces',Georgia,serif; --font-body:'Nunito Sans',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:radial-gradient(1200px 700px at 30% -10%,#17384b 0%,var(--bg) 60%) fixed;color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.4}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance}
.app{max-width:1280px;margin:0 auto;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:16px}
@media(max-width:920px){.app{grid-template-columns:1fr}}
header.top{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
header.top h1{font-size:28px;font-weight:800;letter-spacing:.2px}
header.top p{margin:2px 0 0;color:var(--muted);font-size:13px}
.hbtns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.snd{display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px 3px 3px 3px}
.vol{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding-right:8px}
.vol input{width:84px;accent-color:var(--accent)}
.boardwrap{background:linear-gradient(180deg,#183247,#12293a);border:1px solid var(--line);border-radius:20px;padding:12px;position:relative;box-shadow:0 18px 40px -18px #000c, inset 0 1px 0 #ffffff12}
#msg{min-height:24px;padding:4px 8px 8px;font-weight:700;color:var(--accent)}
#board svg{display:block;width:100%;height:auto;border-radius:16px;box-shadow:0 0 0 3px #0b1a24, 0 0 0 5px #8a6a3b}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.card h3{font-size:15px;margin-bottom:8px;color:var(--muted);font-weight:600;letter-spacing:.3px;text-transform:uppercase;font-family:var(--font-body)}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:8px 12px;border-radius:10px;font:700 13.5px var(--font-body);cursor:pointer;transition:transform .08s,background .15s}
.btn:hover:not(:disabled){background:#25455b}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.primary{background:var(--accent);color:#231a00;border-color:transparent}
.btn.primary:hover:not(:disabled){background:#ffc85c}
.btn.on{outline:2px solid var(--accent)}
.btn:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>.btn{flex:1 1 auto}
.players{display:flex;flex-direction:column;gap:6px}
.pl{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;padding:7px 9px;border-radius:10px;background:var(--panel2);border:1px solid transparent}
.pl.cur{border-color:var(--accent)}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid #0006}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:800 14px var(--font-display);color:#10181e;border:2px solid #ffffff55;box-shadow:inset 0 -6px 10px #0003,0 2px 6px #0006}
.logo{display:flex;gap:12px;align-items:center}.logo svg{width:46px;height:46px;flex:none;filter:drop-shadow(0 3px 6px #0008)}
.pl .nm{font-weight:700}
.pl .sub{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.pl .vp{font:800 22px var(--font-display);font-variant-numeric:tabular-nums}
.tag{background:#0003;border-radius:6px;padding:0 5px;font-size:11px;color:var(--ink)}
.hand{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.chip{--rc:#6d7b8b;background:linear-gradient(180deg,color-mix(in srgb,var(--rc) 42%,#10222f) 0%,#10222f 78%);border-radius:10px;padding:7px 2px 6px;text-align:center;border:1px solid color-mix(in srgb,var(--rc) 55%,#10222f);border-top:4px solid var(--rc);box-shadow:0 6px 12px -8px #000c}
.chip b{display:block;font:800 21px var(--font-display);font-variant-numeric:tabular-nums;text-shadow:0 1px 0 #0008}
.chip span{font-size:11px;color:#c9d7df}
.chip.sel{outline:2px solid var(--accent)}
.chip.btnchip{cursor:pointer}
.ico{display:block;margin:0 auto 2px}
.dice{display:flex;gap:8px;align-items:center}
.dice .sum{font:800 26px var(--font-display);margin-left:6px;font-variant-numeric:tabular-nums}
.devs{display:flex;flex-direction:column;gap:6px}
.dev{display:flex;gap:8px;align-items:center;justify-content:space-between;background:var(--panel2);border-radius:10px;padding:7px 9px}
.dev small{color:var(--muted);display:block;font-size:12px}
.log{max-height:190px;overflow:auto;font-size:13px;color:#c8d6de;display:flex;flex-direction:column;gap:3px}
.log div{padding-left:8px;border-left:2px solid var(--line)}
.log div:first-child{color:var(--ink);border-color:var(--accent)}
.costs{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13px;align-items:center}
.costs .c{display:flex;gap:3px;align-items:center;flex-wrap:wrap}
.costs .c svg{display:inline-block;margin:0}
.hl{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.flash{animation:flash .5s ease-in-out 3}
@keyframes flash{0%,100%{stroke-width:2.5;stroke:#0e1a22}50%{stroke-width:6;stroke:#fff}}
@media(prefers-reduced-motion:reduce){.hl,.flash{animation:none}}
#modal{position:fixed;inset:0;background:#02080cb8;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
#modal.open{display:flex}
#modal.kb{align-items:flex-start;padding-top:8px}
#modal.kb .mbox{max-height:calc(var(--vvh,100vh) - 16px)}
#modal.kb .welcome .wl,#modal.kb .welcome>p{display:none}
#modal.kb .welcome h2{font-size:22px;margin:4px 0 10px}
#modal.open.remote{display:none!important}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;max-width:560px;width:100%;max-height:90vh;overflow:auto}
.mbox h2{font-size:24px;margin-bottom:10px}
.mbox p,.mbox li{color:#cddae2}
.mbox ul{padding-left:18px;margin:8px 0}
.field{display:flex;flex-direction:column;gap:4px;margin:10px 0}
.field label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
select,input[type=text],input[type=number]{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font:600 14px var(--font-body)}
.stalebar,#stalebar{position:fixed;left:8px;right:8px;top:8px;z-index:60;display:flex;flex-direction:column;gap:6px;pointer-events:none}
#stalebar .sb{pointer-events:auto;background:var(--panel,#222);color:var(--ink,#fff);border:1px solid var(--bad,#c33);border-radius:12px;padding:8px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;box-shadow:0 4px 16px #0006}
.rfx{position:fixed;bottom:22%;z-index:70;display:flex;flex-direction:column;align-items:center;pointer-events:none;animation:rfx 2.1s ease-out forwards}
.rfx span{font-size:56px;line-height:1;filter:drop-shadow(0 4px 10px #0008)}
.rfx small{font:700 12px/1 system-ui;background:#0d1a23dd;padding:3px 7px;border-radius:8px;margin-top:4px}
@keyframes rfx{0%{transform:translateY(0) scale(.5);opacity:0}15%{opacity:1;transform:translateY(-20px) scale(1.15)}100%{transform:translateY(-260px) scale(1);opacity:0}}
#reactbar{position:fixed;right:12px;top:calc(64px + env(safe-area-inset-top));z-index:9;display:none;gap:6px;padding:4px 8px;border-radius:26px;background:#0d1a23f2;border:1px solid var(--line);box-shadow:0 8px 22px #0008}
#reactbar.on.open{display:flex}
#reactbtn{position:fixed;right:66px;top:calc(10px + env(safe-area-inset-top));z-index:8;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:#0d1a23ee;font-size:21px;line-height:1;padding:0;display:none;align-items:center;justify-content:center}
#reactbtn.on{display:flex}
#reactbar .rb{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#0d1a23ee;font-size:20px;line-height:1;padding:0}
@media (prefers-reduced-motion:reduce){.rfx{animation-duration:.01s}}
.aw{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:6px 0 10px}
.mact{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.mact .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 16px;line-height:1}
.mact .btn .mi{width:20px;height:20px;margin:0}
.cnt{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px}
.cnt button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-weight:800;cursor:pointer}
.clock{display:flex;gap:16px;align-items:center;justify-content:space-between}
.clock b{font:800 26px var(--font-display);font-variant-numeric:tabular-nums}
.clock .lbl{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.tline{display:flex;align-items:center;gap:8px;margin-top:5px;font-size:12px}
.tt{font-variant-numeric:tabular-nums;font-weight:700;min-width:84px;color:var(--muted)}
.pl.cur .tt{color:var(--ink)}.tt.low{color:var(--bad)!important}
.tbar{flex:1;height:6px;background:#0007;border-radius:3px;overflow:hidden}
.tbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f0b84a,#ffe08a);transition:width .25s linear}
.chk{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.chk input[type=checkbox]{margin-top:3px;width:17px;height:17px;accent-color:var(--accent);flex:none}
.chk small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.chk small input[type=number]{width:70px;padding:3px 6px;font-size:13px}
.rh{margin:16px 0 4px;font-size:18px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inl{display:flex;align-items:center;gap:8px;font-size:14px!important;color:var(--ink)!important;text-transform:none!important;letter-spacing:0!important;padding:9px 0}
.trow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:6px 0;font-size:14px}
.trow select{padding:6px 8px}
.dscT{color:var(--accent)!important;font-weight:800;font-variant-numeric:tabular-nums}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.bbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:9px 6px;min-height:58px;line-height:1.15}
.bbtn small{color:var(--muted);font-weight:600}
.bbtn:disabled small{color:inherit}
.bbtn .cost{display:flex;gap:3px;align-items:center;justify-content:center;flex-wrap:wrap;min-height:14px;font-size:11px;font-weight:700;color:var(--muted)}
.bbtn .ci{display:inline-flex;align-items:center;gap:1px}
.bbtn .ci svg{margin:0}
.bbtn.on{outline:2px solid var(--accent)}
.die{width:40px;height:40px;filter:drop-shadow(0 3px 4px #0008)}
.bw{display:flex;flex-direction:column;gap:3px;min-width:0}
.need{font-size:11.5px;line-height:1.25;color:var(--muted);text-align:center;min-height:14px}
.need.ok{color:var(--good)}
.need.no{color:#e9b7ae}
.need .ci{display:inline-flex;align-items:center;gap:1px;vertical-align:middle;margin:0 2px}
.need svg{display:inline-block;margin:0;vertical-align:-3px}
.hintp{margin:2px 0 6px;color:var(--muted);font-size:12.5px}
#toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-140%);opacity:0;background:var(--panel);border:1px solid var(--accent);border-radius:14px;padding:10px 16px;z-index:14;max-width:min(92vw,520px);box-shadow:0 14px 34px -10px #000;display:flex;flex-direction:column;gap:2px;transition:transform .35s ease,opacity .35s ease;pointer-events:none}
#toast.show{transform:translate(-50%,0);opacity:1}
#toast b{font:800 17px var(--font-display);color:var(--accent)}#toast span{font-size:13.5px;color:#d8e3ea}
.revhex{animation:rev .9s ease-out both}
@keyframes rev{from{opacity:0;filter:brightness(2.2)}to{opacity:1;filter:none}}
.evchip{background:#0003;border:1px solid var(--accent);border-radius:10px;padding:6px 9px;margin-top:6px;font-size:13px}
.evchip b{color:var(--accent)}.evchip small{display:block;color:var(--muted);font-size:12px}
#tut{position:sticky;top:8px;background:var(--panel);border:1.5px solid var(--accent);border-radius:16px;padding:14px;z-index:9;box-shadow:0 18px 40px -12px #000}
#tut h4{margin:0 0 4px;font:800 17px var(--font-display);color:var(--accent)}
#tut p{margin:0 0 10px;color:#d8e3ea;font-size:14px}
#tut .tn{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
#tut .tw{font-size:12.5px;color:var(--accent);margin-bottom:8px}
@media(max-width:920px){#tut{position:fixed;left:8px;right:8px;bottom:8px;top:auto}}
.zoomc{position:absolute;right:20px;top:8px;display:flex;gap:6px;z-index:2}
#dicepos{display:none}
@keyframes bumpk{0%{transform:scale(1)}35%{transform:scale(1.28);filter:brightness(1.5)}100%{transform:scale(1)}}
@keyframes plusk{0%{opacity:0;transform:translateY(4px)}20%{opacity:1}100%{opacity:0;transform:translateY(-26px)}}
.bump{animation:bumpk .6s ease-out;position:relative}
.plus{position:absolute;left:50%;top:-4px;margin-left:-12px;font:800 14px/1 var(--font-display);color:#9be37a;text-shadow:0 1px 3px #000;pointer-events:none;animation:plusk 1.2s ease-out forwards;z-index:5}
@media(prefers-reduced-motion:reduce){.bump,.plus{animation:none}}
body.th-forest #sea stop:nth-child(1){stop-color:#3f9a78}body.th-forest #sea stop:nth-child(2){stop-color:#1f6150}body.th-forest #sea stop:nth-child(3){stop-color:#0d3327}
body.th-snow #sea stop:nth-child(1){stop-color:#a6d4ee}body.th-snow #sea stop:nth-child(2){stop-color:#5b97bf}body.th-snow #sea stop:nth-child(3){stop-color:#27536f}
body.th-dusk #sea stop:nth-child(1){stop-color:#cf7d63}body.th-dusk #sea stop:nth-child(2){stop-color:#82405a}body.th-dusk #sea stop:nth-child(3){stop-color:#2e2040}
.thm{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 14px}
.thm .btn{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:84px;padding:8px}
.thm .sw{width:54px;height:34px;border-radius:9px;border:1px solid #fff4}
.thm .btn.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.cols{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 10px}
.cols .btn{width:48px;height:48px;border-radius:50%;padding:0;border:3px solid #fff3}
.cols .btn.on{border-color:#fff;box-shadow:0 0 0 3px var(--accent)}
#chatbtn{position:fixed;right:12px;top:calc(10px + env(safe-area-inset-top));z-index:8;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:#0d1a23ee;color:var(--ink);font-size:22px;display:none;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 14px #0007}
#chatbtn.on{display:flex}
#chatbtn .bd{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--accent);color:#1b1405;font:800 12px/20px var(--font-body,inherit);text-align:center;padding:0 5px;display:none}
#chatbtn .bd.on{display:block}
#chatfeed{position:fixed;left:10px;right:70px;top:calc(10px + env(safe-area-inset-top));z-index:7;display:flex;flex-direction:column;gap:6px;pointer-events:none}
#chatfeed .ct{background:#0d1a23ee;border:1px solid var(--line);border-radius:12px;padding:7px 11px;font-size:14px;line-height:1.3;max-width:100%;animation:ctin .25s ease-out;box-shadow:0 4px 14px #0006}
#chatfeed .ct b{margin-right:6px}
@keyframes ctin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
#chatpanel{position:fixed;left:0;right:0;bottom:0;z-index:30;display:none;flex-direction:column;max-height:72vh;background:#0f202c;border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -10px 30px #000a;padding:12px 14px calc(12px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
#chatpanel.on{display:flex}
#chatpanel .ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
#chatpanel .ch h3{margin:0;font:800 17px var(--font-display)}
#chatpanel .cl{overflow-y:auto;flex:1;min-height:90px;display:flex;flex-direction:column;gap:5px;margin-bottom:8px}
#chatpanel .cm{font-size:14.5px;line-height:1.35;word-break:break-word}
#chatpanel .cm b{margin-right:6px}
#chatpanel .cq{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
#chatpanel .cq .btn{min-height:40px;padding:4px 12px;font-size:15px}
#chatpanel .cr{display:flex;gap:6px}
#chatpanel .cr input{flex:1;min-height:44px}
.zoomc .btn{width:40px;height:40px;padding:0;font-size:20px;line-height:1}
#msg{padding-right:150px}
#board{touch-action:pan-y}
#board svg{-webkit-user-select:none;user-select:none}
.hl:focus{outline:none}
.hl:focus-visible{stroke:#111!important;stroke-width:5.5px!important;fill-opacity:1!important;filter:drop-shadow(0 0 3px #fff) drop-shadow(0 0 6px #fff)}
.fly{position:fixed;pointer-events:none;z-index:13;width:26px;height:26px;filter:drop-shadow(0 3px 4px #000a)}
.fly svg{display:block;margin:0}
.die.roll{animation:diceroll .85s cubic-bezier(.2,.7,.3,1) both}
@keyframes diceroll{0%{transform:translateY(-34px) rotate(-420deg) scale(.6);opacity:.2}55%{transform:translateY(0) rotate(40deg) scale(1.08);opacity:1}75%{transform:translateY(-8px) rotate(-12deg)}100%{transform:none}}
.sum.roll{animation:sumin .3s .8s both}
@keyframes sumin{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.die.roll,.sum.roll,.revhex{animation:none}}
.mbox.wide{max-width:780px}
.prow{display:grid;grid-template-columns:120px 1fr 38px;gap:8px;align-items:center;margin-top:8px;font-size:14px}
.pbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:#0007}.pbar i{display:block;min-width:2px}
.pdet{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-left:128px}.pdet svg{display:inline-block;margin:0 2px 0 0;vertical-align:-3px}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;margin-top:8px;font-size:13px}
#mbar{display:none}
@media(pointer:coarse),(max-width:920px){
  .btn{min-height:44px;padding:10px 14px;font-size:15px}
  .bbtn{min-height:74px}
  .chip b{font-size:23px}
  select,input[type=text],input[type=number]{min-height:44px;font-size:16px}
  .chk input[type=checkbox]{width:22px;height:22px}
  .cnt button{width:42px;height:42px}
  .zoomc .btn{width:46px;height:46px}
  .bb{min-height:42px;padding:8px 12px}
  .need{font-size:12.5px}
}
@media(max-width:920px){
  .app{padding:10px;gap:10px}
  header.top h1{font-size:23px}
  header.top p{font-size:12px}
  .boardwrap{padding:8px;border-radius:16px}

<body>
<div class="app">

<script>
/* ===================== Datos base ===================== */
const RES=['wood','brick','wool','grain','ore'];
const RNAME={wood:'Barraca',brick:'Adobe',wool:'Lana',grain:'Trigo',ore:'Metal'};
const RFULL={wood:'Barraca de madera',brick:'Adobe',wool:'Lana',grain:'Trigo',ore:'Metal'};
const TNAME={wood:'Bosque',brick:'Barrero',wool:'Pradera',grain:'Trigal',ore:'Cordillera',desert:'Pampa'};
const RCOL={wood:'#4a9a57',brick:'#c86a47',wool:'#9ccf63',grain:'#e9c548',ore:'#7f93a8',desert:'#cdb985'};
const HEXCOL={wood:'#2a6b3c',brick:'#a6523a',wool:'#86b95a',grain:'#d3ae3b',ore:'#6d7b8b',desert:'#c9b47c'};
const PAL={std:['#ef6a5b','#4aa3ff','#8fd14f','#b78cff'],cb:['#E69F00','#56B4E9','#009E73','#CC79A7','#F0E442','#D55E00']};
const MYCOLS=[['Rojo','#ef6a5b'],['Azul','#4aa3ff'],['Verde','#8fd14f'],['Violeta','#b78cff'],['Ámbar','#f2b84b'],['Turquesa','#2ec4b6']];
let MYCOL=0;try{MYCOL=Math.max(0,Math.min(5,parseInt(localStorage.getItem('ta-mycol'))||0));}catch(e){}
const palStd=()=>{const b=MYCOLS.map(x=>x[1]);return [b[MYCOL],...b.filter((_,i)=>i!==MYCOL)];};
const PCOL=palStd().slice(0,6);
const SYM=['●','■','▲','◆'];
const DASH=['','9 5','2 5','10 4 2 4'];
const CBP={on:false};
const ZOOM={s:1,cx:null,cy:null};
const RM=()=>!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
const COARSE=!!(window.matchMedia&&matchMedia('(pointer:coarse)').matches);
const HR=COARSE?15:11,HW=COARSE?18:11;
const BOTNAMES=['Nahuel','Aylén','Quillén','Millaray','Rayén','Lautaro'];
const COST={ship:{wood:1,wool:1},road:{wood:1,brick:1},settle:{wood:1,brick:1,wool:1,grain:1},city:{grain:2,ore:3},dev:{wool:1,grain:1,ore:1}};
const DEVN={knight:'Guardia',road:'Senderos libres',plenty:'Cosecha',monopoly:'Acaparador',vp:'Hito'};
const DEVD={knight:'Mueve el puma y roba una carta. Suma a Guardia mayor.',road:'Construye 2 senderos gratis.',plenty:'Toma 2 recursos del banco.',monopoly:'Elige un recurso: todos te entregan los que tengan.',vp:'Vale 1 punto. Se mantiene oculto.'};

const $=s=>document.querySelector(s);
let RNG=Math.random;
const rnd=n=>Math.floor(RNG()*n);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
let SPEED=1;
const sleep=ms=>SPEED<=0?Promise.resolve():new Promise(r=>setTimeout(r,ms*SPEED));
class Cancel{}
async function sl(ms){const id=G.id,tk=G.tok;await sleep(ms);if(G.id!==id||G.tok!==tk)throw new Cancel();}


/* ===================== Sonido (sintetizado con Web Audio, sin archivos) ===================== */
const SND={on:true,vol:.6,ctx:null,master:null,noise:null,v:1};
try{
  if(localStorage.getItem('ta-sound')==='off')SND.on=false;
  const sv=parseFloat(localStorage.getItem('ta-vol'));if(!isNaN(sv))SND.vol=Math.min(1,Math.max(0,sv));
}catch(e){}
function getCtx(){
  try{
    if(!SND.ctx){
      const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;
      const c=new AC();SND.ctx=c;SND.master=c.createGain();SND.master.gain.value=SND.vol*.8;SND.master.connect(c.destination);
      const len=c.sampleRate,b=c.createBuffer(1,len,c.sampleRate),d=b.getChannelData(0);
      for(let i=0;i<len;i++)d[i]=Math.random()*2-1;SND.noise=b;
    }
    if(SND.ctx.state!=='running'){try{SND.ctx.resume();}catch(e){}}
    return SND.ctx;
  }catch(e){return null;}
}
function audio(){return SND.on?getCtx():null;}
/* ---------- música ambiental (generativa, sin archivos; control propio) ---------- */
const MUS={on:false,vol:.35,g:null,timer:null,step:0};
try{
  if(localStorage.getItem('ta-music')==='on')MUS.on=true;
  const mv=parseFloat(localStorage.getItem('ta-mvol'));if(!isNaN(mv))MUS.vol=Math.min(1,Math.max(0,mv));
}catch(e){}
const MCHORDS=[[57,60,64,67],[53,57,60,64],[48,52,55,59],[55,59,62,64]];
const MPENT=[69,72,74,76,79,81];
const mf=m=>440*Math.pow(2,(m-69)/12);
function musicNote(c,t,f,d,vol,type){
  try{
    const o=c.createOscillator(),g=c.createGain(),fl=c.createBiquadFilter();
    o.type=type||'sine';o.frequency.setValueAtTime(f,t);fl.type='lowpass';fl.frequency.value=1400;
    g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+Math.min(2.2,d*.35));g.gain.linearRampToValueAtTime(0.0001,t+d);
    o.connect(fl);fl.connect(g);g.connect(MUS.g);o.start(t);o.stop(t+d+.1);
  }catch(e){}
}
const MTH={
  calm:{ch:MCHORDS,pent:MPENT,v:1,n:[2,3]},
  day:{ch:[[60,64,67,71],[57,60,64,67],[65,69,72,76],[62,65,69,72]],pent:[72,74,76,79,81,84],v:1,n:[3,4]},
  tense:{ch:[[57,60,63,67],[53,56,60,63],[52,55,58,62],[50,53,57,60]],pent:[69,72,75,77,80],v:1.12,n:[2,2]},
  seven:{ch:[[45,52,57],[43,50,55]],pent:[57,60,63,66],v:1.25,n:[1,2]}
};
const MBIO={wood:{o:-12,t:'triangle'},brick:{o:-5,t:'triangle'},wool:{o:7,t:'sine'},grain:{o:12,t:'sine'},ore:{o:5,t:'square'}};
function musicTheme(){
  try{
    if(!G.players||!G.players.length||G.phase==='idle')return 'calm';
    if(G.over)return 'day';
    if(G.phase==='seven'||G.phase==='robber'||G.mode==='robber')return 'seven';
    if(G.rules.pts&&Math.max(...G.players.map(p=>vp(p.id,false)))>=G.rules.target-2)return 'tense';
    if(G.turn>G.n*3)return 'day';
  }catch(e){}
  return 'calm';
}
function musicBar(){
  const c=SND.ctx;if(!c||!MUS.on||!MUS.g)return;
  const name=musicTheme(),th=MTH[name],bio=MBIO[G.lastRes]||{o:0,t:'sine'};MUS.cur=name;
  const t=c.currentTime+.05,ch=th.ch[MUS.step%th.ch.length];MUS.step++;
  ch.forEach((m,i)=>musicNote(c,t+i*.06,mf(m),8,.05*th.v,'sine'));
  musicNote(c,t,mf(ch[0]-12),8,.07*th.v,'triangle');
  const n=th.n[0]+rnd(th.n[1]-th.n[0]+1);
  for(let i=0;i<n;i++)musicNote(c,t+1+i*1.9+Math.random()*.6,mf(th.pent[rnd(th.pent.length)]+bio.o*(name==='seven'?0:.5)),name==='tense'?2.4:3,.035*th.v,bio.t==='square'?'triangle':bio.t);
}
function musicRefresh(){
  if(!MUS.on||!MUS.timer||!MUS.g)return;
  if(musicTheme()!==MUS.cur){clearInterval(MUS.timer);musicBar();MUS.timer=setInterval(musicBar,7000);}
}
function musicStart(){
  const c=getCtx();if(!c)return;
  try{if(!MUS.g){MUS.g=c.createGain();MUS.g.gain.value=MUS.vol*.55;MUS.g.connect(c.destination);}}catch(e){return;}
  clearInterval(MUS.timer);musicBar();MUS.timer=setInterval(musicBar,7000);
}
function musicStop(){
  clearInterval(MUS.timer);MUS.timer=null;
  const g=MUS.g;MUS.g=null;
  if(g)try{g.gain.setTargetAtTime(0,SND.ctx.currentTime,.25);setTimeout(()=>{try{g.disconnect();}catch(e){}},1500);}catch(e){}
}
function updateMusUI(){
  const b=$('#musbtn'),v=$('#mvol');
  if(b){b.textContent=MUS.on?'Música: sí':'Música: no';b.setAttribute('aria-pressed',MUS.on?'true':'false');b.classList.toggle('on',MUS.on);}
  if(v){v.value=Math.round(MUS.vol*100);v.disabled=!MUS.on;}
}
function toggleMusic(){
  MUS.on=!MUS.on;
  try{localStorage.setItem('ta-music',MUS.on?'on':'off');}catch(e){}
  if(MUS.on)musicStart();else musicStop();
  updateMusUI();
}
function setMVol(x){
  MUS.vol=Math.min(1,Math.max(0,(+x)/100));
  try{localStorage.setItem('ta-mvol',String(MUS.vol));}catch(e){}
  if(MUS.g)try{MUS.g.gain.value=MUS.vol*.55;}catch(e){}
}
if('serviceWorker' in navigator&&/^https:|^http:\/\/localhost/.test(location.protocol+'//'+location.host)&&location.protocol!=='file:'){window.addEventListener('load',()=>{try{navigator.serviceWorker.register('/sw.js').catch(()=>{});}catch(e){}});}

function balancedOK(hs){
  const land=hs.filter(h=>h.type!=='desert');
  for(const a of land)for(const b of land){
    if(a===b||!adjH(a,b))continue;
    if(isRed(a.num)&&isRed(b.num))return false;
    if(a.num===b.num)return false;

  for(const a of hs)for(const b of hs)for(const c of hs){
    if(a.id<b.id&&b.id<c.id&&a.type===b.type&&b.type===c.type&&a.type!=='desert'&&adjH(a,b)&&adjH(b,c)&&adjH(a,c))return false;
  }

/* mapas temáticos: cada hexágono «prefiere» ciertos terrenos según su posición y se reparten con algo de azar */
function themedLayout(mode){

  const hs=coords.map(([q,r],i)=>({id:i,q,r,type:null,num:0})),left={...HI};

    else if(mode==='fiords'){if(d===R){if(t==='ore')s+=3;if(t==='brick')s+=2.5;if(t==='wood')s+=1;}else if(d>=1){if(t==='wool'||t==='grain')s+=2;}if(t==='desert'&&d===0)s+=4;}
    else if(mode==='volcano'){if(t==='desert'&&d===0)s+=8;if(d===1){if(t==='ore')s+=3;if(t==='brick')s+=2.5;}if(d>=2&&(t==='wood'||t==='wool'||t==='grain'))s+=1.5;}
    else if(mode==='ridge'){if(Math.abs(h.q-h.r)<=1){if(t==='ore')s+=3;if(t==='brick')s+=2.5;}else if(t==='wood'||t==='wool'||t==='grain')s+=1;if(t==='desert'&&h===tip)s+=3;}

}
function layoutMain(mode,custom){
  const coords=mainCoords();
  const mk=(types,nums)=>coords.map(([q,r],i)=>({id:i,q,r,type:types[i],num:nums[i]||0}));
  if(mode==='beginner'&&!BIG){

  if(mode==='custom'&&custom&&custom.length===NMAIN)return coords.map(([q,r],i)=>({id:i,q,r,type:custom[i].type,num:custom[i].num||0}));

  const nums=[];for(const n in NINV)for(let i=0;i<NINV[n];i++)nums.push(+n);
  let hs=null;
  for(let t=0;t<4000;t++){

    const arr=ty.map(x=>x==='desert'?0:ns[k++]);

      const land=hs.filter(h=>h.type!=='desert');
      if(!land.some(a=>isRed(a.num)&&land.some(b=>b!==a&&isRed(b.num)&&adjH(a,b))))return hs;
    }else if(balancedOK(hs))return hs;

/* reparte números 2..12 sobre los terrenos ya puestos (para el editor y la isla) */
function balanceNumbers(hs){

    if(balancedOK(hs))return;

    let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;

    const m=78,w=Math.max(x1-x0+2*m,620),hh=Math.max(y1-y0+2*m,570),cx=(x0+x1)/2,cy=(y0+y1)/2;

    const m=60,w=x1-x0+2*m,hh=y1-y0+2*m;VB=[(x0+x1)/2-w/2,(y0+y1)/2-hh/2,w,hh];

  if(o.wild){const c=shuffle(H.filter(h=>h.id<NMAIN&&h.type!=='desert'));c.slice(0,3).forEach(h=>{h.wild=true;});}
  H.forEach(h=>{h.art=hexArt(h);});
}

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function insideHex(x,y,m){
  const inr=S*SQ/2-m;
  for(const t of [0,60,120]){const a=t*Math.PI/180;if(Math.abs(x*Math.cos(a)+y*Math.sin(a))>inr)return false;}
  return true;
}
function scatter(r,n,minR,maxR,minD){
  const pts=[];
  for(let k=0;k<400&&pts.length<n;k++){
    const a=r()*Math.PI*2,d=minR+r()*(maxR-minR),x=Math.cos(a)*d,y=Math.sin(a)*d;
    if(!insideHex(x,y,7))continue;
    if(pts.some(p=>Math.hypot(p[0]-x,p[1]-y)<minD))continue;
    pts.push([+x.toFixed(1),+y.toFixed(1)]);
  }
  return pts.sort((p,q)=>p[1]-q[1]);
}

function longestRoad(pid){
  const mine=E.filter(e=>e.owner===pid);if(!mine.length)return 0;
  let best=0;
  function dfs(vid,used,len,lk){
    best=Math.max(best,len);
    const v=V[vid];
    if(len>0&&v.b&&v.b.owner!==pid)return;
    for(const eid of v.edges){
      const e=E[eid];if(e.owner!==pid||used.has(eid))continue;
      if(len>0&&lk!==e.kind&&!(v.b&&v.b.owner===pid))continue; // sendero y barco solo se unen en un pueblo propio
      used.add(eid);dfs(other(e,vid),used,len+1,e.kind);used.delete(eid);
    }
  }
  const starts=new Set();mine.forEach(e=>{starts.add(e.a);starts.add(e.b);});
  for(const s of starts)dfs(s,new Set(),0,null);
  return best;
}

/* ===================== Producción y dados ===================== */
function produce(sum){
  const need={},srcs=[],gotR={};
  const dr=evA('sequia'),hf=evA('helada'),co=evA('cosecha'),fl=evA('crecida');
  for(const h of H){
    if(h.num!==sum)continue;
    if((dr&&dr.res===h.type)||(hf&&hf.res===h.type))continue;
    const extra=(co&&co.res===h.type)?1:0,mul=((fl&&fl.res===h.type)?2:1)*(h.wild?2:1);
    for(const vid of h.v){
      const b=V[vid].b;if(!b)continue;
      if(h.id===G.robber&&!hasUpg(b.owner,'mur'))continue;
      const n=(b.type==='c'?2:1)*mul+extra;
      need[h.type]=need[h.type]||{};
      need[h.type][b.owner]=(need[h.type][b.owner]||0)+n;
      srcs.push({h:h.id,r:h.type,o:b.owner,n,w:!!h.wild});
    }
  }
  const got={};
  for(const r in need){
    const owners=Object.keys(need[r]);
    const sumNeed=owners.reduce((s,o)=>s+need[r][o],0);
    if(G.bank[r]>=sumNeed){
      owners.forEach(o=>{G.players[o].res[r]+=need[r][o];G.prodStat[o][r]+=need[r][o];gotR[o+'|'+r]=1;got[o]=got[o]||[];got[o].push(`${need[r][o]} ${RNAME[r]}`);});
      G.bank[r]-=sumNeed;
    }else if(owners.length===1){
      const o=owners[0],n=Math.min(G.bank[r],need[r][o]);
      if(n>0){G.players[o].res[r]+=n;G.bank[r]-=n;G.prodStat[o][r]+=n;gotR[o+'|'+r]=1;got[o]=got[o]||[];got[o].push(`${n} ${RNAME[r]}`);}
    }else say(`El banco no tiene suficiente ${RNAME[r]}: nadie recibe.`);
  }
  if(G.cfg.humanSeat>=0&&got[G.cfg.humanSeat])sfx('collect');
  const rk=Object.keys(need);if(rk.length)G.lastRes=rk[0];
  const any=Object.keys(got);
  if(!any.length)say('Nadie produce con este número.');
  any.forEach(o=>say(`${pn(+o)} recibe ${got[o].join(', ')}.`));
  // tierras salvajes: las fieras se llevan una carta a quien cosechó allí
  const hit=new Set();srcs.forEach(x=>{if(x.w&&gotR[x.o+'|'+x.r])hit.add(x.o);});
  hit.forEach(o=>{const p=G.players[o],pool=[];RES.forEach(r=>{for(let i=0;i<p.res[r];i++)pool.push(r);});if(pool.length){const r=pool[rnd(pool.length)];p.res[r]--;G.bank[r]++;say(`Las fieras de las tierras salvajes se llevan 1 ${RNAME[r]} de ${p.name}.`);}});
  // Cosechadores del Valle: consuelo si la tirada no les dio nada
  G.players.forEach((p,i)=>{if(fac(i)==='cos'&&!got[i]&&G.bank.grain>0){p.res.grain++;G.bank.grain--;say(`${p.name} (Cosechadores) recibe 1 Trigo de consuelo.`);}});
  if(G.cfg.humanSeat>=0)flyFrom(srcs.filter(x=>x.o===G.cfg.humanSeat&&gotR[x.o+'|'+x.r]));
}

  const vics=moveRobber(pid,h.id);
  if(vics.length)steal(pid,vics[rnd(vics.length)]);
}
function setRobber(hid){const o=H[G.robber];if(o&&!G.hidden){G.pumaPrev=pumaPos(o);G.pumaAt=Date.now();}G.robber=hid;}
function moveRobber(pid,hid){
  setRobber(hid);sfx('thud',isBot(pid)?.55:1);
  say(`${pn(pid)} mueve el puma a ${TNAME[H[hid].type]}${H[hid].num?' '+H[hid].num:''}.`);
  const vs=new Set();
  for(const vid of H[hid].v){const b=V[vid].b;if(b&&b.owner!==pid&&!(G.teams&&teamOf(b.owner)===teamOf(pid))&&total(G.players[b.owner])>0&&!hasUpg(b.owner,'mur'))vs.add(b.owner);}
  return [...vs];
}
function steal(pid,vic){
  const v=G.players[vic],p=G.players[pid];
  const pool=[];RES.forEach(r=>{for(let i=0;i<v.res[r];i++)pool.push(r);});
  if(!pool.length)return;
  const r=pool[rnd(pool.length)];v.res[r]--;p.res[r]++;sfx('steal',isBot(pid)?.55:1);
  if(G.thief){G.thief[pid].stole++;G.thief[vic].robbed++;}
  say(!isBot(pid)||!isBot(vic)?`${p.name} le roba 1 ${RNAME[r]} a ${v.name}.`:`${p.name} le roba una carta a ${v.name}.`);
}

/* ===================== Turnos ===================== */
function beginPlay(){snap();G.cur=0;G.phase='roll';G.mode=null;say('Comienza la partida.');startTurn();}
async function revealMap(){
  const id=G.id;
  G.busy=true;G.phase='setupBot';G.mode=null;G.msg='¡Todos colocaron sus pueblos y senderos! Se revela el mapa…';render();sfx('magic');
  try{
    await sl(1000);
    G.hidden=false;G.revealAt=Date.now();say('Se revela el mapa: aparecen terrenos y números.');
    const ps=G.pendStart;G.pendStart=[];for(const [pid,vid] of ps)grantStart(pid,vid);
    G.msg='Mapa revelado. Los segundos pueblos reciben sus recursos.';render();sfx('award');
    await sl(1800);
  }catch(e){if(e instanceof Cancel)return;throw e;}
  if(G.id===id)beginPlay();
}
async function setupStep(){
  const id=G.id;
  if(G.setupIdx>=G.setupSeq.length){
    if(G.hidden){revealMap();return;}
    beginPlay();return;
  }
  const pid=G.setupSeq[G.setupIdx];G.cur=pid;
  const second=G.setupIdx>=G.n;
  if(isBot(pid)){
    G.busy=true;G.phase='setupBot';G.msg=`${pn(pid)} elige su ubicación…`;render();
    try{await sl(450);botSetup(pid,second);render();await sl(250);}catch(e){if(e instanceof Cancel)return;throw e;}
    G.setupIdx++;setupStep();
  }else{
    G.busy=false;G.phase='setupS';G.mode=(typeof TUT!=='undefined'&&TUT.on&&TUT.hold)?null:'setupS';
    G.msg=second?'Segundo pueblo: elige una intersección (recibirás recursos).':'Coloca tu primer pueblo en una intersección resaltada.';
    render();
  }
}
function startTurn(){
  G.turn++;G.devPlayed=false;G.phase='roll';G.mode=null;G.pend=null;G.forcing=false;G.beep=null;G.tOff=0;G.refused={};
  G.ev=(G.ev||[]).filter(e=>e.until>G.turn);
  if(G.rules.auc&&G.cur===0)G.auc={lot:newLot(),bids:{}};
  if(G.rules.events&&G.cur===0&&G.turn>1){const ri=(G.turn-1)/G.n;if(ri>0&&ri%G.rules.evEvery===0)triggerEvent();}
  if(G.rules.timer){G.turnLimit=G.limits[G.cur];G.turnEnd=Date.now()+G.turnLimit*1000;G.paused=false;G.timerOn=true;}else G.timerOn=false;
  NETH.pending();NETH.snap();
  if(isBot(G.cur)){G.busy=true;G.msg=`Turno de ${pn(G.cur)}…`;render();botTurn(G.cur);}
  else{G.busy=false;G.msg=G.cur===G.cfg.humanSeat?'Tu turno: tira los dados.':`Turno de ${pn(G.cur)}.`;render();sfx('turn');saveGame(false);}
}
function endTurn(){
  if(G.over)return;
  G.timerOn=false;G.tok++;snap();
  if(G.rules.turnLimit&&G.turn>=G.rules.maxTurns){finishByLimit();return;}
  G.undo=null;
  if(G.rules.auc&&(G.cur+1)%G.n===0)resolveAuction();
  G.cur=(G.cur+1)%G.n;startTurn();
}

/* ===================== Relojes ===================== */
function fmt(ms){
  const t=Math.max(0,Math.ceil(ms/1000)),h=Math.floor(t/3600),m=Math.floor(t%3600/60),sec=t%60;
  return (h?h+':'+String(m).padStart(2,'0'):String(m))+':'+String(sec).padStart(2,'0');
}
const gameMs=()=>G.t0?((G.tEnd||Date.now())-G.t0):0;
function setPaused(f){
  if(f&&!G.paused){G.pauseLeft=Math.max(0,G.turnEnd-Date.now());G.paused=true;}
  else if(!f&&G.paused){G.turnEnd=Date.now()+G.pauseLeft;G.paused=false;}
}
const clockRunning=()=>G.rules.timer&&G.timerOn&&!G.paused&&!G.over;
function timerLine(p){
  if(!G.rules.timer||G.phase==='idle')return '';
  return `<div class="tline"><span class="tt" id="tt${p.id}"></span><span class="tbar"><i id="tb${p.id}"></i></span></div>`;
}
function updateClocks(){
  const g=$('#gclock');if(g)g.textContent=fmt(gameMs());
  if(G.rules&&G.rules.timer)for(const p of G.players){
    const tt=$('#tt'+p.id),tb=$('#tb'+p.id);if(!tt||!tb)continue;
    if(p.id===G.cur&&G.timerOn&&!G.over){
      const left=G.paused?G.pauseLeft:G.turnEnd-Date.now();
      tt.textContent=fmt(left)+(G.paused?' (pausa)':'');
      tt.className='tt'+(left<10000?' low':'');
      tb.style.width=Math.min(100,100*left/(G.turnLimit*1000))+'%';
    }else{tt.textContent='Límite '+G.limits[p.id]+' s';tt.className='tt';tb.style.width='0';}
  }
  const d=$('#dsc-t');if(d&&G.dsc&&G.dsc.end)d.textContent='Tiempo restante: '+fmt(G.dsc.end-Date.now());
}
function autoPlenty(pid){
  const p=G.players[pid];let n=G.pl?G.pl.length:0;
  for(let k=0;k<40&&n<2;k++){const r=RES[rnd(5)];if(G.bank[r]>0){G.bank[r]--;p.res[r]++;n++;}}
  say(`${p.name} toma 2 recursos al azar con Cosecha.`);
}
async function forceTimeout(){
  if(G.over||G.forcing)return;
  const id=G.id,pid=G.cur;
  G.forcing=true;G.timerOn=false;G.busy=true;G.tok++;
  say(`Se acabó el tiempo de ${pn(pid)}: su turno termina solo.`);sfx('deny');
  try{
    if(G.pend==='plenty')autoPlenty(pid);
    else if(G.pend==='monopoly')monoPick(RES[rnd(5)]);
    else if(G.pend==='victim'){const v=G.pendVics;steal(pid,v[rnd(v.length)]);G.phase=G.resume;}
    G.pend=null;closeModal();G.mode=null;
    if(G.phase==='robber'){moveRobberRandom(pid);G.phase=G.resume;}
    else if(G.phase==='seven'){moveRobberRandom(pid);G.phase='main';}
    if(G.phase==='roll'){
      const s=rollDice();G.phase='seven';render();
      if(s===7)await resolveSeven('auto');else produce(s);
    }
    G.phase='main';G.mode=null;render();
    await sleep(700);
  }catch(e){if(!(e instanceof Cancel))throw e;}
  if(G.id!==id)return;
  G.forcing=false;
  if(!G.over)endTurn();
}
function tick(){
  try{
    if(G.phase==='idle'||!G.players.length){updateClocks();return;}
    if(!G.over){
      if(G.dsc&&G.dsc.end&&Date.now()>=G.dsc.end)G.dsc.auto();
      if(clockRunning()){
        const left=G.turnEnd-Date.now();
        if(!isBot(G.cur)){const sc=Math.ceil(left/1000);if(sc<=5&&sc>=1&&G.beep!==sc){G.beep=sc;sfx('beep');}}
        if(left<=0)forceTimeout();
      }
    }
    updateClocks();
  }catch(e){console.error(e);}
}

/* ===================== Acciones humanas ===================== */
const humanTurn=()=>!G.over&&G.cur===G.cfg.humanSeat&&!G.busy;
const canMain=()=>humanTurn()&&G.phase==='main';
async function uiRoll(){
  if(!humanTurn()||G.phase!=='roll')return;
  tutEvent('roll');
  const s=rollDice();
  if(s===7){G.phase='seven';G.mode=null;render();await resolveSeven('human');}
  else{produce(s);G.phase='main';G.msg='Construye, comercia o termina tu turno.';render();}
}
function uiEnd(){if(!canMain())return;G.mode=null;tutEvent('end');endTurn();}
function setMode(m){
  if(!canMain())return;
  if(G.mode===m){G.mode=null;G.msg='';render();return;}
  const pid=G.cur,p=G.players[pid];
  if(m==='build-road'){
    if(p.left.road<1||!canPay(p,costOf('road',pid))||!legalRoads(pid).length)return;
    G.msg='Elige dónde colocar el sendero.';
  }else if(m==='build-ship'){
    if(!G.rules.expansion||p.left.ship<1||!canPay(p,COST.ship)||!legalRoads(pid,undefined,'ship').length)return;
    G.msg='Elige una arista de mar para el barco.';
  }else if(m==='build-settle'){
    if(p.left.settle<1||!canPay(p,COST.settle)||!legalSettle(pid,false).length)return;
    G.msg='Elige dónde fundar el pueblo.';
  }else if(m==='build-city'){
    if(p.left.city<1||!canPay(p,COST.city)||!myVerts(pid,'s').length)return;
    G.msg='Elige un pueblo para ampliar a castillo.';
  }
  G.mode=m;render();
}
function uiBuyDev(){
  if(!canMain()||!G.rules.dev)return;
  const p=G.players[G.cur];
  if(!G.deck.length||!canPay(p,COST.dev))return;
  spend(p,COST.dev);G.undo=null;
  const t=G.deck.pop();p.dev.push({t,turn:G.turn});
  say(`${p.name} compra una carta de desarrollo.`);sfx('card');
  G.msg=t==='vp'?'Compraste un Hito (1 punto oculto).':`Compraste: ${DEVN[t]}.`;
  render();checkWin();
}
function uiPlayDev(i){
  if(!canMain()&&!(humanTurn()&&G.phase==='roll'))return;
  const p=G.players[G.cur],c=p.dev[i];
  if(!c||c.t==='vp'||c.turn===G.turn||G.devPlayed)return;
  G.devPlayed=true;p.dev.splice(i,1);G.undo=null;
  say(`${p.name} juega ${DEVN[c.t]}.`);sfx(c.t==='knight'?'award':'magic');
  if(c.t==='knight'){
    p.knights++;updateAwards();guardBonus(G.cur);
    G.resume=G.phase;G.phase='robber';G.mode='robber';G.msg='Mueve el puma: toca un hexágono.';render();checkWin();
  }else if(c.t==='road'){
    G.freeLeft=Math.min(2,p.left.road);G.resume=G.phase;
    if(!G.freeLeft||!legalRoads(G.cur).length){G.msg='No puedes construir senderos.';render();return;}
    G.mode='freeroad';G.msg='Coloca un sendero gratis (quedan '+G.freeLeft+').';render();
  }else if(c.t==='plenty'){openPlenty();}
  else if(c.t==='monopoly'){openMonopoly();}
}
function onBoard(k,id){
  if(NET.role==='guest'){if(NET.started)netSend({t:'call',id:NET.id,s:`onBoard('${k}',${id})`});return;}
  if(!humanTurn())return;
  const m=G.mode,pid=G.cur;
  if(k==='v'){
    if(m==='setupS'&&canSettle(id,pid,true)){
      placeSettle(pid,id,true);
      if(G.setupIdx>=G.n)grantStart(pid,id);
      G.lastSettle=id;G.mode='setupR';G.msg='Ahora coloca un sendero junto a ese pueblo.';render();
    }else if(m==='build-settle'&&canSettle(id,pid,false)){
      pushUndo();placeSettle(pid,id,false);G.mode=null;G.msg='';render();checkWin();
    }else if(m==='build-city'&&canCity(id,pid)){
      pushUndo();placeCity(pid,id);G.mode=null;G.msg='';render();checkWin();
    }
  }else if(k==='e'){
    if(m==='setupR'&&canRoad(id,pid,G.lastSettle)){
      placeRoad(pid,id,true);G.mode=null;G.setupIdx++;setupStep();
    }else if(m==='build-road'&&canRoad(id,pid)){
      pushUndo();placeRoad(pid,id,false);G.mode=null;G.msg='';render();checkWin();
    }else if(m==='build-ship'&&canRoad(id,pid,undefined,'ship')){
      pushUndo();placeRoad(pid,id,false,'ship');G.mode=null;G.msg='';render();checkWin();
    }else if(m==='freeroad'&&canRoad(id,pid)){
      placeRoad(pid,id,true);G.freeLeft--;
      if(G.freeLeft>0&&legalRoads(pid).length){G.msg='Coloca otro sendero gratis.';}
      else{G.mode=null;G.msg='';}
      render();checkWin();
    }
  }else if(k==='h'&&m==='robber'&&id!==G.robber){
    const vics=moveRobber(pid,id);
    const done=()=>{G.mode=null;G.phase=G.resume;G.msg=G.phase==='roll'?'Ahora tira los dados.':'Construye, comercia o termina tu turno.';render();};
    if(vics.length===0)done();
    else if(vics.length===1){steal(pid,vics[0]);done();}
    else{
      G.mode=null;G.pend='victim';G.pendVics=vics;render();
      openModal(`<h2>¿A quién robas?</h2><div class="row">${vics.map(v=>`<button class="btn" onclick="pickVictim(${v})"><span class="dot" style="display:inline-block;background:${G.players[v].color}"></span> ${G.players[v].name}</button>`).join('')}</div>`);
      window.pickVictim=v=>{G.pend=null;closeModal();steal(pid,v);done();};
    }
  }
}

/* ===================== Banco y comercio ===================== */
function doBank(pid,give,get){
  const p=G.players[pid],r=ratio(pid,give);
  if(give===get||p.res[give]<r||G.bank[get]<1)return false;
  p.res[give]-=r;G.bank[give]+=r;p.res[get]++;G.bank[get]--;G.undo=null;if(pid===G.cfg.humanSeat)G.tr++;
  say(`${p.name} cambia ${r} ${RNAME[give]} por 1 ${RNAME[get]} con el banco.`);sfx('coin',isBot(pid)?.5:1);
  return true;
}
function openBank(){
  if(!canMain())return;
  G.bk=G.bk||{give:null,get:null};G.bk.give=null;G.bk.get=null;drawBank();
}
function drawBank(){
  const p=G.players[G.cur],b=G.bk;
  const ok=b.give&&b.get&&b.give!==b.get&&p.res[b.give]>=ratio(G.cur,b.give)&&G.bank[b.get]>0;
  openModal(`<h2>Comercio con el banco</h2>
   <p>Das varias cartas iguales y recibes 1 de tu elección. La tasa depende de tus puertos.</p>
   <div class="field"><label>Entregas</label><div class="hand">${RES.map(r=>`<div class="chip btnchip ${b.give===r?'sel':''}" style="--rc:${RCOL[r]}" onclick="bkPick('give','${r}')" tabindex="0" role="button">${icon(r,22)}<b>${ratio(G.cur,r)}:1</b><span>${RNAME[r]} (${p.res[r]})</span></div>`).join('')}</div></div>
   <div class="field"><label>Recibes</label><div class="hand">${RES.map(r=>`<div class="chip btnchip ${b.get===r?'sel':''}" style="--rc:${RCOL[r]}" onclick="bkPick('get','${r}')" tabindex="0" role="button">${icon(r,22)}<b>1</b><span>${RNAME[r]}</span></div>`).join('')}</div></div>
   <div class="mact"><button class="btn" onclick="closeModal()">Cerrar</button><button class="btn primary" ${ok?'':'disabled'} onclick="bkGo()">Cambiar</button></div>`);
}
function bkPick(w,r){G.bk[w]=r;drawBank();}
function bkGo(){const b=G.bk;if(doBank(G.cur,b.give,b.get)){G.bk.give=null;G.bk.get=null;drawBank();render();}}

/* ---------- Tratos entre jugadores ----------
   Una oferta es {from,to,give:{rec:n},get:{rec:n}}: "from" entrega give y recibe get.
   askTrade() decide según quién ocupa el asiento "to": un rival IA, una persona en este
   dispositivo o (a futuro) una persona remota, que respondería a través de NET.ask(oferta). */
const seatKind=pid=>isBot(pid)?'bot':((typeof NET!=='undefined'&&NET.remote&&NET.remote[pid])?'remote':'local');
const resTxt=m=>RES.filter(r=>m[r]).map(r=>`${m[r]} ${RNAME[r]}`).join(' + ');
const offerTxt=o=>`${resTxt(o.give)} a cambio de ${resTxt(o.get)}`;
function tradeValid(o){
  const a=G.players[o.from],b=G.players[o.to];
  return RES.every(r=>a.res[r]>=(o.give[r]||0)&&b.res[r]>=(o.get[r]||0))&&RES.some(r=>o.give[r])&&RES.some(r=>o.get[r]);
}
function applyTrade(o){
  const a=G.players[o.from],b=G.players[o.to];G.undo=null;if(o.from===G.cfg.humanSeat||o.to===G.cfg.humanSeat)G.tr++;
  for(const r of RES){const g=o.give[r]||0,t=o.get[r]||0;a.res[r]+=t-g;b.res[r]+=g-t;}
}
function botDecides(pid,o){ // pid recibe o.give y entrega o.get
  const b=G.players[pid],goal=botGoal(pid),d=diff(pid);
  let vin=0,vout=0;
  for(const r of RES){
    const n=o.give[r]||0,m=o.get[r]||0;
    if(n)vin+=n*((goal[r]||0)>b.res[r]?3:(b.res[r]===0?1.6:.8));
    if(m)vout+=m*(b.res[r]-m<(goal[r]||0)?3:1);
  }
  if(vin<vout*({easy:.55,normal:1,hard:1.35}[d]))return false;
  if(d==='hard'&&vp(o.from,false)>=G.rules.target-2)return false;
  return true;
}
function humanTradeModal(o){
  return new Promise(res=>{NETH.as(o.to,()=>{
    const wasPaused=G.paused;setPaused(true);
    const done=ok=>{G.dsc=null;G.tradeAsk=null;closeModal();if(!wasPaused)setPaused(false);res(ok);};
    G.dsc={end:Date.now()+20000,auto:()=>{say(`Sin respuesta: se rechaza el trato de ${pn(o.from)}.`);done(false);}};
    G.tradeAsk=o;
    const ic=m=>RES.filter(r=>m[r]).map(r=>`<span class="chip" style="--rc:${RCOL[r]};display:inline-block;min-width:62px">${icon(r,24)}<b>${m[r]}</b><span>${RNAME[r]}</span></span>`).join(' ');
    openModal(`<h2>Propuesta de trato</h2><p><b>${pn(o.from)}</b> te ofrece:</p><div style="margin:6px 0">${ic(o.give)}</div><p>a cambio de:</p><div style="margin:6px 0">${ic(o.get)}</div>
      <p id="dsc-t" class="dscT"></p>
      <div class="mact"><button class="btn" id="tr-no">Rechazar</button><button class="btn primary" id="tr-ok">Aceptar</button></div>`);
    $('#tr-ok').onclick=()=>done(true);$('#tr-no').onclick=()=>{say(`Rechazas el trato de ${pn(o.from)}.`);done(false);};
    updateClocks();
  });});
}
async function askTrade(o){
  if(!tradeValid(o))return false;
  const k=seatKind(o.to);
  if(k==='bot'){await sl(650);return botDecides(o.to,o);}
  if(k==='local')return await humanTradeModal(o);
  if(k==='remote'&&NET.ask)return await NET.ask(o);
  return false;
}
function openTrade(){
  if(!canMain()||!G.rules.trade)return;
  const opts=RES.map(r=>`<option value="${r}">${RFULL[r]}</option>`).join('');
  const to=G.players.filter(p=>p.id!==G.cur).map(p=>`<option value="${p.id}">${p.name}</option>`).join('');
  openModal(`<h2>Proponer un trato</h2>
   <p>Los rivales responden según lo que necesiten. Pueden aceptar o rechazar.</p>
   <div class="field"><label for="t-to">Proponer a</label><select id="t-to"><option value="any">Cualquier rival</option>${to}</select></div>
   <div class="field"><label>Entregas</label><div class="row"><input id="t-gn" type="number" min="1" max="9" value="1" style="width:70px"><select id="t-g" style="flex:1">${opts}</select></div></div>
   <div class="field"><label>Pides</label><div class="row"><input id="t-rn" type="number" min="1" max="9" value="1" style="width:70px"><select id="t-r" style="flex:1">${opts}</select></div></div>
   <div class="mact"><button class="btn" onclick="closeModal()">Cerrar</button><button class="btn primary" onclick="propose()">Proponer</button></div>`);
  $('#t-r').value='brick';
}
async function propose(){
  const g=$('#t-g').value,r=$('#t-r').value,gn=Math.max(1,+$('#t-gn').value||1),rn=Math.max(1,+$('#t-rn').value||1),to=$('#t-to').value;
  const me=G.cur,mp=G.players[me];
  if(g===r){alert_('Elige recursos distintos.');return;}
  if(mp.res[g]<gn){alert_(`No tienes ${gn} de ${RNAME[g]}.`);return;}
  closeModal();
  const targets=to==='any'?G.players.filter(p=>p.id!==me).map(p=>p.id):[+to];
  G.busy=true;G.msg='Esperando respuestas…';render();
  try{
    for(const pid of targets){
      const o={from:me,to:pid,give:{[g]:gn},get:{[r]:rn}};
      if(!tradeValid(o)){say(`${pn(pid)} no tiene ${rn} ${RNAME[r]}.`);continue;}
      say(`${mp.name} propone a ${pn(pid)}: ${offerTxt(o)}.`);render();
      if(await askTrade(o)){
        applyTrade(o);say(`${pn(pid)} acepta el trato.`);sfx('coin');G.msg=`${pn(pid)} aceptó tu trato.`;G.busy=false;render();return;
      }
      say(`${pn(pid)} rechaza el trato.`);render();
    }
    say('Nadie acepta tu propuesta.');sfx('deny');G.msg='Nadie aceptó. Prueba ofrecer más.';
  }catch(e){if(e instanceof Cancel)return;throw e;}
  G.busy=false;render();
}
function alert_(t){
  const m=$('#modal .mbox');if(!m)return;
  let el=$('#modal .err');if(!el){el=document.createElement('p');el.className='err';el.style.color='var(--bad)';m.insertBefore(el,m.querySelector('.mact'));}
  el.textContent=t;
}

const pipsV=vid=>V[vid].hexes.reduce((s,h)=>s+(H[h].type==='desert'?0:pipsOfNum(H[h].num)),0);
function producing(pid){
  const s=new Set();
  for(const v of V)if(v.b&&v.b.owner===pid)v.hexes.forEach(h=>{if(H[h].type!=='desert')s.add(H[h].type);});
  return s;
}
function vScore(vid,pid){
  const v=V[vid],have=producing(pid);
  const types=new Set(v.hexes.map(h=>H[h].type).filter(t=>t!=='desert'));
  let s=pipsV(vid)+types.size*1.5;
  types.forEach(t=>{if(!have.has(t))s+=2.5;});
  if(v.port==='any')s+=1.5;else if(v.port&&(types.has(v.port)||have.has(v.port)))s+=3;
  if(v.port&&pers(pid)==='com')s+=2;
  s+=v.hexes.filter(h=>H[h].wild).length*1.5;
  return s;
}
function pickBest(list,f){const nz=CB>=0?NOISE[diff(CB)]:.8;let b=null,bs=-1e9;for(const x of list){const s=f(x)+Math.random()*nz;if(s>bs){bs=s;b=x;}}return b;}
function lookahead(x,pid){
  let best=0;
  for(const n of nbrs(x))for(const m of nbrs(n))if(m!==x&&canSettleIgnoringRoad(m)&&!nbrs(x).includes(m))best=Math.max(best,vScore(m,pid));
  return best*.35;
}
function botSetup(pid,second){

  const v=hid?l[rnd(l.length)]:pickBest(l,x=>vScore(x,pid)+(hard?lookahead(x,pid):0));
  placeSettle(pid,v,true);
  if(second)grantStart(pid,v);
  const rl=legalRoads(pid,v);
  const e=hid?rl[rnd(rl.length)]:pickBest(rl,x=>vScore(other(E[x],v),pid));

function expansionScore(eid,pid){
  const e=E[eid];let best=0;
  for(const vid of [e.a,e.b]){
    const v=V[vid];if(v.b)continue;
    if(v.edges.some(x=>E[x].owner===pid))continue; // extremo ya conectado
    if(canSettleIgnoringRoad(vid))best=Math.max(best,vScore(vid,pid)+4);
    else for(const n of nbrs(vid)){if(!V[n].b&&canSettleIgnoringRoad(n))best=Math.max(best,vScore(n,pid)*.5);}
  }
  return best+(best>0&&pers(pid)==='con'?1.5:0);
}
function canSettleIgnoringRoad(vid){
  if(V[vid].b||!V[vid].hexes.length)return false;
  for(const n of nbrs(vid))if(V[n].b)return false;
  return true;
}
function botMoveRobber(pid){

  const best=pickBest(H.filter(h=>h.id!==G.robber),h=>{
    let s=0;
    for(const vid of h.v){
      const b=V[vid].b;if(!b)continue;
      const w=(b.type==='c'?2:1)*pipsOfNum(h.num||7);

function botGoal(pid){

  if(p.left.city>0&&myVerts(pid,'s').length&&p.res.ore+p.res.grain>=3)return COST.city;
  if(p.left.settle>0&&legalSettle(pid,false).length)return COST.settle;

function botTrade(pid){

  if(!target)return false;
  for(const r of RES){
    if(r===target)continue;
    const extra=p.res[r]-(goal[r]||0);
    if(extra>=ratio(pid,r)&&G.bank[target]>0)return doBank(pid,r,target);
  }
  return false;

function botAct(pid){

    const vs=myVerts(pid,'s');

  }

    const l=legalSettle(pid,false);

  }

  }
  return false;

/* el rival propone un trato a otros jugadores cuando le falta poco para construir */
async function botOffer(pid){
  const p=G.players[pid],goal=botGoal(pid),d=diff(pid);
  const miss=RES.filter(r=>(goal[r]||0)>p.res[r]);
  const missN=miss.reduce((x,r)=>x+goal[r]-p.res[r],0);
  if(!miss.length||missN>(pers(pid)==='com'?3:2))return false;
  const want=miss[0];
  const spare=RES.filter(r=>r!==want&&p.res[r]-(goal[r]||0)>=1).sort((a,b)=>(p.res[b]-(goal[b]||0))-(p.res[a]-(goal[a]||0)));
  if(!spare.length)return false;
  const give=spare[0];
  let cands=G.players.filter(q=>q.id!==pid&&q.res[want]>0&&!(G.refused[q.id]&&seatKind(q.id)!=='bot'));
  if(d==='hard')cands=cands.filter(q=>vp(q.id,false)<G.rules.target-1);
  cands=shuffle(cands).slice(0,2);
  const gn=(d==='easy'&&p.res[give]-(goal[give]||0)>=2)?2:1;
  for(const q of cands){
    if(G.tOff>=(pers(pid)==='com'?5:3))break;
    const o={from:pid,to:q.id,give:{[give]:gn},get:{[want]:1}};
    if(!tradeValid(o))continue;
    G.tOff++;
    say(`${p.name} propone a ${q.name}: ${offerTxt(o)}.`);render();
    if(await askTrade(o)){applyTrade(o);say(`${q.name} acepta el trato de ${p.name}.`);sfx('coin',.7);render();return true;}
    say(`${q.name} rechaza el trato de ${p.name}.`);if(seatKind(q.id)!=='bot')G.refused[q.id]=1;render();
  }
  return false;
}

function mbarHTML(){
  if(G.cfg.humanSeat<0||G.phase==='idle'||G.over||!G.players.length)return '';
  const hu=G.players[HS()];
  const mres=hu?`<div class="mres" role="group" aria-label="Tus recursos">${RES.map(r=>`<span class="mr${hu.res[r]?'':' z'}" style="--rc:${RCOL[r]}" title="${RFULL[r]}">${icon(r,20)}<b>${hu.res[r]}</b></span>`).join('')}</div>`:'';
  let mbld='';
  if(hu&&humanTurn()&&canMain()){
    const pid=HS(),o=[];
    if(hu.left.road>=1&&canPay(hu,costOf('road',pid))&&legalRoads(pid).length)o.push(['build-road','Sendero']);
    if(hu.left.settle>=1&&canPay(hu,COST.settle)&&legalSettle(pid,false).length)o.push(['build-settle','Pueblo']);
    if(hu.left.city>=1&&canPay(hu,COST.city)&&myVerts(pid,'s').length)o.push(['build-city','Castillo']);
    if(G.rules.expansion&&hu.left.ship>=1&&canPay(hu,COST.ship)&&legalRoads(pid,undefined,'ship').length)o.push(['build-ship','Barco']);
    const dev=G.rules.dev&&G.deck.length&&canPay(hu,COST.dev);
    if(o.length||dev)mbld=`<div class="mbuild" role="group" aria-label="Puedes construir"><span class="ml">Puedes:</span>${o.map(([m,l])=>`<button class="btn bl${G.mode===m?' on':''}" onclick="setMode('${m}')">${l}</button>`).join('')}${dev?'<button class="btn bl" onclick="uiBuyDev()">Carta</button>':''}</div>`;
  }
  return mres+mbld+`<button class="btn primary" ${humanTurn()&&G.phase==='roll'?'':'disabled'} onclick="uiRoll()">Tirar dados</button><button class="btn" onclick="document.querySelector('#sec-build').scrollIntoView({behavior:'smooth',block:'center'})">Construir</button><button class="btn" ${canMain()?'':'disabled'} onclick="uiEnd()">Terminar</button>`;

/* ¿qué me falta para construir? */
function needFor(kind){
  if(G.phase==='idle'||G.phase.startsWith('setup')||G.over||G.cfg.humanSeat<0)return null;
  const hu=G.players[HS()],no=t=>({ok:false,html:t}),ic=(r,n)=>`<span class="ci">${n>1?n:''}${icon(r,12)}</span>`;
  if(G.cur!==HS())return no('No es tu turno');
  if(G.phase==='roll')return no('Tira los dados primero');
  if(G.phase!=='main')return no('Termina la acción en curso');
  if(kind==='bank'){return RES.some(r=>hu.res[r]>=ratio(HS(),r))?null:no('Necesitas '+Math.min(...RES.map(r=>ratio(HS(),r)))+' cartas iguales');}
  if(kind==='trade'){return total(hu)?null:no('No tienes cartas');}
  const c=kind==='road'?costOf('road',HS()):COST[kind];
  const left={road:'senderos',settle:'pueblos',city:'castillos',ship:'barcos'}[kind];
  if(kind==='ship'&&evA('temporal'))return no('Temporal: sin barcos esta ronda');
  if(left&&hu.left[kind==='road'?'road':kind]<1)return no('No te quedan '+left);
  if(kind==='dev'&&!G.deck.length)return no('El mazo está vacío');
  const miss=RES.filter(r=>(c[r]||0)>hu.res[r]);
  if(miss.length){
    let t='Te falta: '+miss.map(r=>ic(r,c[r]-hu.res[r])).join(' ');
    const need=miss.reduce((x,r)=>x+c[r]-hu.res[r],0);
    if(need===1){const r=miss[0],x=RES.find(y=>y!==r&&hu.res[y]-(c[y]||0)>=ratio(HS(),y));if(x)t+=`<br>Banco: ${ic(x,ratio(HS(),x))}→${ic(r,1)}`;}
    return no(t);
  }
  if(kind==='road'&&!legalRoads(HS()).length)return no('No hay dónde construir');
  if(kind==='settle'&&!legalSettle(HS(),false).length)return no('Necesitas un sendero que llegue a una intersección libre');
  if(kind==='city'&&!myVerts(HS(),'s').length)return no('Necesitas un pueblo para ampliar');
  if(kind==='ship'&&!legalRoads(HS(),undefined,'ship').length)return no('Necesitas un pueblo costero o un barco');
  return {ok:true,html:'Listo para construir'};
}

function startFromForm(){
  const spectate=$('#c-spec').checked,nb=spectate?4:+$('#c-bots').value,n=spectate?nb:nb+1;
  const mx=Math.min(999,Math.max(10,parseInt($('#r-max').value)||100));
  const map=$('#c-map').value;
  if(map==='custom'&&!window.CUSTOM){openEditor();return;}
  const rules={pts:$('#r-pts').checked,target:+$('#r-tgt').value,turnLimit:$('#r-lim').checked,maxTurns:mx,timer:$('#r-tm').checked,discard:$('#r-dis').checked,trade:$('#r-trd').checked,dev:$('#r-dev').checked,bonus:$('#r-bon').checked,expansion:$('#r-exp').checked,events:$('#r-ev').checked||$('#r-wx').checked,evEvery:+$('#r-evn').value,wx:$('#r-wx').checked,obj:$('#r-obj').checked,fac:$('#r-fac').checked,auc:$('#r-auc').checked,upg:$('#r-upg').checked,wild:$('#r-wild').checked,pers:$('#r-pers').checked,noPorts:$('#r-nop').checked,teams:!!($('#r-teams')&&$('#r-teams').checked&&n===4)};
  if(!rules.pts&&!rules.turnLimit)rules.pts=true;
  const limits=Array.from({length:n},(_,i)=>{const e=$('#tm'+i);return e?+e.value:60;});
  const diffs=Array.from({length:n},(_,i)=>{const e=$('#df'+i);return e?e.value:'normal';});
  const tutorial=$('#r-tut').checked&&!spectate;
  const cfg={name:$('#c-name').value.trim()||'Tú',bots:nb,speed:+$('#c-speed').value,spectate,rules,limits,map,custom:window.CUSTOM,diff:diffs,humanFac:$('#c-fac').value};

function marker(x,y,id,r=5.5){
  const c=PCOL[id],st=`fill="${c}" stroke="#0d1a23" stroke-width="1.6"`;
  if(id===1)return `<rect x="${x-r}" y="${y-r}" width="${2*r}" height="${2*r}" ${st}/>`;
  if(id===2)return `<polygon points="${x},${y-r-1} ${x+r+1},${y+r} ${x-r-1},${y+r}" ${st}/>`;
  if(id===3)return `<polygon points="${x},${y-r-1.5} ${x+r+1.5},${y} ${x},${y+r+1.5} ${x-r-1.5},${y}" ${st}/>`;
  return `<circle cx="${x}" cy="${y}" r="${r}" ${st}/>`;
}
function chartSVG(){
  const hs=G.hist;if(!hs||hs.length<2)return '<p>Partida demasiado corta para graficar.</p>';
  const W=560,Ht=240,L=34,R=22,T=14,B=28,maxT=Math.max(1,hs[hs.length-1].t);
  const maxV=Math.max(G.rules.pts?G.rules.target:0,...hs.flatMap(r=>r.vp),4)+1;
  const X=t=>L+(W-L-R)*t/maxT,Y=v=>Ht-B-(Ht-B-T)*v/maxV;
  let s=`<svg viewBox="0 0 ${W} ${Ht}" role="img" aria-label="Gráfico de puntos por turno de cada jugador" style="width:100%;height:auto;background:#10222f;border-radius:12px">`;
  const step=maxV>12?2:1;
  for(let v=0;v<=maxV;v+=step)s+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#2b4659" stroke-width="1"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="#8fa6b4">${v}</text>`;
  for(let i=0;i<=5;i++){const t=Math.round(maxT*i/5);s+=`<text x="${X(t)}" y="${Ht-9}" text-anchor="middle" font-size="11" fill="#8fa6b4">${t}</text>`;}
  s+=`<text x="${(L+W-R)/2}" y="${Ht-1}" text-anchor="middle" font-size="10" fill="#8fa6b4">turno</text>`;
  if(G.rules.pts)s+=`<line x1="${L}" x2="${W-R}" y1="${Y(G.rules.target)}" y2="${Y(G.rules.target)}" stroke="#f0b84a" stroke-width="1.4" stroke-dasharray="3 4"/><text x="${W-R}" y="${Y(G.rules.target)-4}" text-anchor="end" font-size="10.5" fill="#f0b84a">meta ${G.rules.target}</text>`;
  const last=hs[hs.length-1];
  G.players.forEach(p=>{
    s+=`<polyline points="${hs.map(r=>X(r.t).toFixed(1)+','+Y(r.vp[p.id]).toFixed(1)).join(' ')}" fill="none" stroke="${PCOL[p.id]}" stroke-width="2.6" stroke-dasharray="${DASH[p.id]||'none'}" stroke-linejoin="round" stroke-linecap="round"/>`;
  });
  G.players.forEach(p=>{s+=marker(X(last.t),Y(last.vp[p.id]),p.id);});
  return s+'</svg>';
}
/* premios y cifras por jugador al terminar */
function awardsHTML(){
  if(!G.thief)return '';
  const tot=G.prodStat.map(x=>RES.reduce((a,r)=>a+x[r],0)),n=G.players.length;
  const top=(arr,min)=>{const m=Math.max(...arr);if(m<min)return null;const w=arr.map((v,i)=>v===m?i:-1).filter(i=>i>=0);return w.length===1?{i:w[0],v:m}:null;};
  const aw=[
    ['⛏️ Más productivo',top(tot,1),v=>v+' cartas con los dados'],
    ['🦊 El ladrón',top(G.thief.map(x=>x.stole),1),v=>v+' robos'],
    ['😵 El más robado',top(G.thief.map(x=>x.robbed),1),v=>v+' cartas perdidas'],
    ['🛡️ Más guardias',top(G.players.map(q=>q.knights),1),v=>v+' guardias jugados'],
    ['🏗️ Más constructor',top(G.players.map(q=>(15-q.left.road)+(5-q.left.settle)*2+(4-q.left.city)*3),1),v=>'la mayor obra levantada']
  ].filter(a=>a[1]);
  const rows=G.players.map(q=>`<div class="prow"><span>${SYM[q.id]} ${q.name}</span><span class="pdet" style="margin:0">Producción ${tot[q.id]} · Robó ${G.thief[q.id].stole} · Le robaron ${G.thief[q.id].robbed} · Guardias ${q.knights}</span></div>`).join('');
  return `<h3 class="rh">Premios y cifras</h3>${aw.length?`<div class="aw">${aw.map(a=>`<div class="evchip"><b>${a[0]}</b><small>${G.players[a[1].i].name}: ${a[2](a[1].v)}</small></div>`).join('')}</div>`:''}${rows}`;
}
function prodHTML(){
  const tot=G.prodStat.map(x=>RES.reduce((a,r)=>a+x[r],0)),mx=Math.max(1,...tot);
  return G.players.map(p=>{
    const x=G.prodStat[p.id];
    return `<div class="prow"><span>${SYM[p.id]} ${p.name}</span><span class="pbar" style="width:${Math.max(5,100*tot[p.id]/mx).toFixed(0)}%">${RES.map(r=>x[r]?`<i style="flex:${x[r]};background:${RCOL[r]}" title="${RNAME[r]} ${x[r]}"></i>`:'').join('')}</span><b>${tot[p.id]}</b></div>
     <div class="pdet">${RES.map(r=>`<span>${icon(r,13)}${x[r]}</span>`).join('')}</div>`;
  }).join('');
}
function decisive(){
  const hs=G.hist,w=(G.winners||[G.winner])[0];
  if(w==null||!hs||hs.length<2)return null;
  let last=-1;
  hs.forEach((r,i)=>{if(r.vp[w]<=Math.max(...r.vp.filter((_,j)=>j!==w)))last=i;});
  let idx,sub;
  if(last===-1){
    let bg=-1;idx=1;
    for(let i=1;i<hs.length;i++){const g=hs[i].vp[w]-hs[i-1].vp[w];if(g>bg){bg=g;idx=i;}}
    sub='Lideró casi toda la partida; este fue su mayor salto.';
  }else{idx=Math.min(last+1,hs.length-1);sub='Desde ese turno no volvió a ir por detrás.';}
  const from=idx>0?hs[idx-1].t:0,to=hs[idx].t;
  const evs=[...new Set(G.key.filter(k=>k.pid===w&&k.t>from&&k.t<=to).map(k=>k.txt))].slice(0,2);
  const b=idx>0?hs[idx-1].vp[w]:0,a=hs[idx].vp[w];
  return {t:to,html:`<b>Momento decisivo · turno ${to}</b><small>${G.players[w].name} ${evs.length?evs.join(' y '):'tomó la delantera'} y pasó de ${b} a ${a} puntos. ${sub}</small>`};
}
function showWin(limit){
  snap();NETH.end();

  const tw=G.teams&&ws.length===2&&ws[0]%2===ws[1]%2;
  const title=tw?(meIn?'¡Ganó tu equipo!':`Ganó el ${TEAMN[ws[0]%2]}`):ws.length>1?`Empate entre ${names.join(' y ')}`:(meIn?'¡Ganaste la costa!':`${names[0]} fundó la colonia`);
  const why=limit?`Se llegó al límite de ${G.rules.maxTurns} turnos.`:tw?`${TEAMN[ws[0]%2]} suma ${teamVP(ws[0]%2)} puntos (meta ${teamGoal()}).`:`${names[0]} llegó a ${vp(ws[0])} puntos.`;
  const rows=G.players.slice().sort((a,b)=>vp(b.id)-vp(a.id)).map(q=>`<div class="pl" style="grid-template-columns:30px 1fr auto"><span class="av" style="background:${q.color}">${q.name[0].toUpperCase()}</span><div class="nm">${CBP.on?SYM[q.id]+' ':''}${q.name}${ws.includes(q.id)?' (gana)':''}</div><div class="vp">${vp(q.id)}</div></div>`).join('');
  const dec=decisive(),lastRow=G.hist[G.hist.length-1],extra=endExtras();
  openModal(`<h2>${title}</h2><p>${why} Turno ${G.turn} · duración ${fmt(gameMs())}.</p><div class="players" style="margin-top:8px">${rows}</div>

   <h3 class="rh">Puntos por turno</h3>${chartSVG()}
   <div class="legend">${G.players.map(p=>`<span><span style="color:${PCOL[p.id]};font-weight:800">${SYM[p.id]}</span> ${p.name} · ${lastRow?lastRow.vp[p.id]:vp(p.id)} pts</span>`).join('')}</div>

}

function tutHeader(){
  if(TUT.on){TUT.on=false;tutDraw();return;}
  if(G.phase==='idle'||!G.players.length||G.cfg.humanSeat!==0){
    openModal('<h2>Tutorial guiado</h2><p>Marca «Tutorial guiado» al empezar una partida contra rivales, y una tarjeta te acompañará en tus primeras jugadas. Durante una partida, este botón abre un recorrido rápido por el panel.</p><div class="mact"><button class="btn primary" onclick="closeModal()">Entendido</button></div>');
    return;
  }
  tutStart(G.setupIdx===0&&G.phase==='setupS'?'full':'tour');
  if(TUT.steps[0]&&TUT.steps[0].intro&&G.phase==='setupS'){TUT.hold=true;G.mode=null;render();}
}
function tutDraw(){
  const el=$('#tut');if(!el)return;
  if(!TUT.on||TUT.i>=TUT.steps.length){
    TUT.on=false;el.style.display='none';
    if(G.phase==='setupS'&&!G.mode&&G.players.length&&!G.over){G.mode=TUT.hold?null:'setupS';}
    TUT.hold=false;
    if(G.phase==='setupS'&&G.cfg.humanSeat===0&&!G.mode){G.mode='setupS';render();}
    tutHL();return;
  }
  const st=TUT.steps[TUT.i],was=TUT.hold;TUT.hold=!!st.intro;
  const last=TUT.i===TUT.steps.length-1;
  el.style.display='block';
  el.innerHTML=`<div class="tn">Tutorial · paso ${TUT.i+1} de ${TUT.steps.length}</div><h4>${st.t}</h4><p>${st.p}</p>
   ${st.wait?'<div class="tw">Hazlo en el juego para continuar…</div>':''}
   <div class="row">${st.wait?'':`<button class="btn primary" onclick="tutNext()">${last?'Terminar':'Siguiente'}</button>`}<button class="btn" onclick="tutHeader()">Salir de la guía</button></div>`;
  if(was&&!TUT.hold&&G.phase==='setupS'&&G.cfg.humanSeat===0){G.mode='setupS';render();}
  tutHL();
}
function tutNext(){TUT.i++;tutDraw();}
function tutEvent(ev){
  if(!TUT.on)return;
  const st=TUT.steps[TUT.i];if(!st)return;
  if(st.wait===ev){TUT.i++;tutDraw();return;}
  if(!st.wait){ // si actuó antes de terminar de leer, salta hasta el paso que corresponde
    const j=TUT.steps.findIndex((x,k)=>k>TUT.i&&x.wait===ev);
    if(j>=0&&TUT.steps.slice(TUT.i,j).every(x=>!x.wait)){TUT.i=j+1;tutDraw();}
  }
}
function tutHL(){
  document.querySelectorAll('.tut-hl').forEach(e=>e.classList.remove('tut-hl'));
  if(!TUT.on)return;
  const st=TUT.steps[TUT.i];if(!st||!st.hl)return;
  const e=document.querySelector(st.hl);if(e)e.classList.add('tut-hl');
}

/* ===================== Creador de mapa ===================== */
const ED={cells:[],brush:{k:'type',v:'wood'},msg:''};
function edUsed(){
  const t={},n={};
  ED.cells.forEach(c=>{if(c.type)t[c.type]=(t[c.type]||0)+1;if(c.num)n[c.num]=(n[c.num]||0)+1;});
  return {t,n};
}
function edHexes(){return mainCoords().map(([q,r],i)=>({id:i,q,r,type:ED.cells[i].type||'x',num:ED.cells[i].num||0}));}
function edComplete(){return ED.cells.every(c=>c.type&&(c.type==='desert'||c.num));}
function openEditor(){
  BIG=false;NMAIN=19;
  if(ED.cells.length!==NMAIN)ED.cells=mainCoords().map(()=>({type:null,num:0}));
  if(window.CUSTOM&&!ED.loaded){ED.cells=window.CUSTOM.map(c=>({...c}));ED.loaded=true;}
  ED.msg='';$('#editor').classList.add('open');drawEditor();
}
function closeEditor(){$('#editor').classList.remove('open');const m=$('#c-map');if(m&&m.value==='custom'&&!window.CUSTOM){m.value='balanced';mapChanged();}}
function edBrush(k,v){ED.brush={k,v};ED.msg='';drawEditor();}
function edHex(i){
  const c=ED.cells[i],b=ED.brush,u=edUsed();ED.msg='';
  if(b.k==='erase'){c.type=null;c.num=0;}
  else if(b.k==='type'){
    if(c.type!==b.v){
      if((u.t[b.v]||0)>=HINV[b.v])ED.msg=`Ya usaste todos los hexágonos de ${TNAME[b.v]} (${HINV[b.v]}).`;
      else{c.type=b.v;if(b.v==='desert')c.num=0;}
    }
  }else{
    if(!c.type)ED.msg='Primero elige el terreno de ese hexágono.';
    else if(c.type==='desert')ED.msg='La Pampa no lleva número.';
    else if(c.num!==b.v){
      if((u.n[b.v]||0)>=NINV[b.v])ED.msg=`Ya usaste todos los ${b.v} (${NINV[b.v]}).`;
      else c.num=b.v;
    }
  }
  drawEditor();
}
function edFill(){
  const u=edUsed(),left=[];
  for(const t in HINV)for(let i=0;i<HINV[t]-(u.t[t]||0);i++)left.push(t);
  const sh=shuffle(left);ED.cells.forEach(c=>{if(!c.type)c.type=sh.pop();if(c.type==='desert')c.num=0;});
  const nc=edUsed().n,nl=[];for(const n in NINV)for(let i=0;i<NINV[n]-(nc[n]||0);i++)nl.push(+n);
  const ns=shuffle(nl);ED.cells.forEach(c=>{if(c.type&&c.type!=='desert'&&!c.num)c.num=ns.pop();});
  ED.msg='';drawEditor();
}
function edBalance(){
  if(ED.cells.some(c=>!c.type)){ED.msg='Completa primero todos los terrenos (o usa «Rellenar al azar»).';drawEditor();return;}
  const hs=edHexes();balanceNumbers(hs);ED.cells.forEach((c,i)=>{c.num=hs[i].type==='desert'?0:hs[i].num;});ED.msg='';drawEditor();
}
function edClear(){ED.cells=mainCoords().map(()=>({type:null,num:0}));ED.msg='';drawEditor();}
function edLoad(){ED.cells=layoutMain('balanced').map(h=>({type:h.type,num:h.num}));ED.msg='';drawEditor();}
function edUse(){
  if(!edComplete()){ED.msg='Faltan terrenos o números por asignar.';drawEditor();return;}
  window.CUSTOM=ED.cells.map(c=>({...c}));ED.loaded=true;
  $('#editor').classList.remove('open');
  const m=$('#c-map');if(m){m.value='custom';mapChanged();}
}
function drawEditor(){
  const u=edUsed(),hs=edHexes();
  let svg=`<svg viewBox="-250 -232 500 464" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="Hexágonos del mapa">`;
  hs.forEach(h=>{
    const c=hexCenter(h.q,h.r),pts=[0,1,2,3,4,5].map(k=>{const p=corner(c,k);return p.x.toFixed(1)+','+p.y.toFixed(1);}).join(' ');
    const cell=ED.cells[h.id],red=isRed(cell.num);
    svg+=`<g onclick="edHex(${h.id})" style="cursor:pointer"><polygon points="${pts}" fill="${cell.type?HEXCOL[cell.type]:'#2a4357'}" stroke="#0e1a22" stroke-width="2.5" stroke-linejoin="round"/>`;
    if(cell.type&&cell.type!=='desert')svg+=icon(cell.type,26,`x="${c.x-13}" y="${c.y-34}" pointer-events="none"`);
    else if(cell.type==='desert')svg+=`<text x="${c.x}" y="${c.y+4}" text-anchor="middle" font-size="11" font-weight="800" fill="#6e5c2e" letter-spacing="1.5" pointer-events="none">PAMPA</text>`;
    else svg+=`<text x="${c.x}" y="${c.y+8}" text-anchor="middle" font-size="24" font-weight="800" fill="#fff" fill-opacity=".4" pointer-events="none">?</text>`;
    if(cell.num)svg+=`<circle cx="${c.x}" cy="${c.y+14}" r="15" fill="#f6ecd0" stroke="#8a7440" stroke-width="1.3" pointer-events="none"/><text x="${c.x}" y="${c.y+20}" text-anchor="middle" font-size="17" font-weight="800" font-family="Fraunces,serif" fill="${red?'#c4271b':'#26211a'}" pointer-events="none">${cell.num}</text>`;
    svg+='</g>';
  });
  svg+='</svg>';
  const bt=(k,v,label,cnt,tot)=>`<button class="bb ${ED.brush.k===k&&ED.brush.v===v?'sel':''}" onclick="edBrush('${k}',${typeof v==='number'?v:`'${v}'`})">${k==='type'&&v!=='desert'?icon(v,18):''}${label}${tot!=null?` <span class="n">${cnt}/${tot}</span>`:''}</button>`;
  const types=['wood','brick','wool','grain','ore','desert'].map(t=>bt('type',t,TNAME[t],u.t[t]||0,HINV[t])).join('');
  const nums=Object.keys(NINV).map(n=>bt('num',+n,n,u.n[n]||0,NINV[n])).join('');
  const reds=[];hs.forEach(a=>hs.forEach(b=>{if(a.id<b.id&&isRed(a.num)&&isRed(b.num)&&adjH(a,b))reds.push(`${a.num} y ${b.num}`);}));
  const same=[];hs.forEach(a=>hs.forEach(b=>{if(a.id<b.id&&a.num&&a.num===b.num&&adjH(a,b))same.push(a.num);}));
  const warn=[];
  if(reds.length)warn.push(`Hay 6/8 contiguos (${reds.join(', ')}): es legal, pero desequilibra.`);
  if(same.length)warn.push(`Números repetidos contiguos: ${same.join(', ')}.`);
  const nT=ED.cells.filter(c=>c.type).length,nN=ED.cells.filter(c=>c.num).length,ok=edComplete();
  $('#editor').innerHTML=`<div class="edbox"><h2>Creador de mapa</h2>
   <div>${svg}<p class="hintp" style="margin-top:8px">Elige un pincel a la derecha y toca los hexágonos. Los puertos se reparten al azar en la costa.</p></div>
   <div>
    <div class="hintp"><b>Terreno</b></div><div class="bset">${types}</div>
    <div class="hintp"><b>Número</b> (hexágonos con terreno)</div><div class="bset">${nums}</div>
    <div class="bset">${bt('erase','x','Borrar hexágono')}</div>
    <div class="bset"><button class="btn" onclick="edFill()">Rellenar al azar</button><button class="btn" onclick="edBalance()">Equilibrar números</button><button class="btn" onclick="edLoad()">Cargar equilibrado</button><button class="btn" onclick="edClear()">Limpiar</button></div>
    <p class="hintp">Terrenos ${nT}/19 · Números ${nN}/18 ${ok?'<span class="edok">· Completo</span>':''}</p>
    <div class="edwarn">${[ED.msg,...warn].filter(Boolean).join('<br>')}</div>
    <div class="mact"><button class="btn" onclick="closeEditor()">Cancelar</button><button class="btn primary" ${ok?'':'disabled'} onclick="edUse()">Usar este mapa</button></div>
   </div></div>`;
}

/* ---------- gestos del tablero (arrastrar y pellizcar) y teclado ---------- */
(function(){
  const b=$('#board'),PT=new Map();let pinch=null,lastPan=null;
  b.addEventListener('pointerdown',e=>{
    PT.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(PT.size===2){const [p,q]=[...PT.values()];pinch={d:Math.hypot(p.x-q.x,p.y-q.y)||1,s:ZOOM.s};dragMoved=true;}
    else{lastPan={x:e.clientX,y:e.clientY};dragMoved=false;}
  });
  b.addEventListener('pointermove',e=>{
    const p=PT.get(e.pointerId);if(!p)return;
    p.x=e.clientX;p.y=e.clientY;
    if(PT.size===2&&pinch){
      const [a,c]=[...PT.values()];ZOOM.s=Math.min(4,Math.max(1,pinch.s*Math.hypot(a.x-c.x,a.y-c.y)/pinch.d));
      if(ZOOM.s<=1.001){ZOOM.s=1;ZOOM.cx=ZOOM.cy=null;}
      applyView();return;
    }
    if(ZOOM.s>1&&PT.size===1&&lastPan){
      const dx=e.clientX-lastPan.x,dy=e.clientY-lastPan.y;
      if(Math.hypot(dx,dy)>4||dragMoved){
        dragMoved=true;
        const svg=$('#board svg');if(!svg)return;
        const r=svg.getBoundingClientRect(),vb=svg.getAttribute('viewBox').split(' ').map(Number),u=vb[2]/(r.width||1);
        ZOOM.cx=(ZOOM.cx==null?vb[0]+vb[2]/2:ZOOM.cx)-dx*u;ZOOM.cy=(ZOOM.cy==null?vb[1]+vb[3]/2:ZOOM.cy)-dy*u;
        lastPan={x:e.clientX,y:e.clientY};applyView();
      }
    }
  });
  const up=e=>{PT.delete(e.pointerId);if(PT.size<2)pinch=null;if(PT.size===1){const v=[...PT.values()][0];lastPan={x:v.x,y:v.y};}};
  b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);
  b.addEventListener('wheel',e=>{if(e.ctrlKey||e.metaKey){e.preventDefault();zoomBy(e.deltaY<0?1.15:1/1.15);}},{passive:false});
  b.addEventListener('keydown',e=>{
    const t=e.target;if(!t.hasAttribute||!t.hasAttribute('data-k')||!t.hasAttribute('tabindex'))return;
    if(e.key==='Enter'||e.key===' '){e.preventDefault();onBoard(t.dataset.k,+t.dataset.id);return;}
    const dir={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];if(!dir)return;
    e.preventDefault();
    const cx=+t.dataset.x,cy=+t.dataset.y;let best=null,bs=1e9;
    b.querySelectorAll('[data-k][tabindex]').forEach(o=>{
      if(o===t)return;const dx=+o.dataset.x-cx,dy=+o.dataset.y-cy,al=dx*dir[0]+dy*dir[1];if(al<=1)return;
      const sc=Math.hypot(dx,dy)+Math.abs(dx*dir[1]-dy*dir[0])*1.2;if(sc<bs){bs=sc;best=o;}
    });
    if(best){best.focus({preventScroll:true});if(ZOOM.s>1){ZOOM.cx=+best.dataset.x;ZOOM.cy=+best.dataset.y;applyView();}}
  });
})();
document.addEventListener('keydown',e=>{

function todayKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function seedOf(k){let h=2166136261;for(const ch of k){h^=ch.charCodeAt(0);h=Math.imul(h,16777619);}return h>>>0;}
function startDaily(){
  const k=todayKey(),sd=seedOf(k),maps=['balanced','classic','balanced'];
  launch({name:'Tú',bots:3,speed:1,spectate:false,map:maps[sd%3],rules:{},diff:['normal','normal','normal','normal'],seed:sd,daily:k});
}

function loadStats(){
  const b={games:0,wins:0,streak:0,best:0,fast:0,by:{easy:[0,0],normal:[0,0],hard:[0,0],mix:[0,0]},ach:{}},o=LS.get('ta-stats',{})||{};
  const r=Object.assign(b,o);r.by=Object.assign(b.by,o.by||{});r.ach=o.ach||{};return r;
}
function recordEnd(){
  if(G.statsDone||G.cfg.humanSeat!==0||G.cfg.net)return [];
  G.statsDone=true;
  const st=loadStats(),won=!!(G.winners&&G.winners.length===1&&G.winners[0]===0),rounds=Math.ceil(G.turn/G.n);
  const ds=G.players.filter(p=>isBot(p.id)).map(p=>diff(p.id)),dk=ds.every(d=>d===ds[0])?ds[0]:'mix';
  st.games++;st.by[dk][0]++;
  if(won){st.wins++;st.by[dk][1]++;st.streak++;st.best=Math.max(st.best,st.streak);st.fast=st.fast?Math.min(st.fast,rounds):rounds;}else st.streak=0;
  if(G.camp!=null&&won){const c=loadCamp();c.done[G.camp]=true;c.best[G.camp]=c.best[G.camp]?Math.min(c.best[G.camp],rounds):rounds;LS.set('ta-camp',c);}
  if(G.daily){
    const d=LS.get('ta-daily',{})||{},prev=d[G.daily],cur={won,turns:G.turn,vp:vp(HS()),rounds};
    if(!prev||(won&&(!prev.won||cur.turns<prev.turns)))d[G.daily]=cur;
    const ks=Object.keys(d).sort();while(ks.length>30)delete d[ks.shift()];
    LS.set('ta-daily',d);
  }
  const ctx={won,rounds,noTrade:G.tr===0,diffs:dk,expl:G.explorer===0,daily:!!G.daily,mdone:!!(G.obj&&G.obj[HS()]&&G.obj[HS()].done),upgAll:!!(G.upg&&Object.keys(UPGN).every(k=>G.upg[HS()][k])),lens:G.lens?G.lens[HS()]:0,aucWins:G.aucWins||0};
  const fresh=[];
  for(const a of ACH)if(!st.ach[a.id]&&a.chk(ctx,st)){st.ach[a.id]=Date.now();fresh.push(a);}
  LS.set('ta-stats',st);
  return fresh;
}
