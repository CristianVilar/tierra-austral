name: Pruebas en móvil
on:
  push:
    branches: [main]
  pull_request:
jobs:
  movil:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python3 -m http.server 8765 >/dev/null 2>&1 &
      - run: sleep 2 && python3 tests/mobile_smoke.py http://localhost:8765/index.html
