<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0d1a23">
<title>Tierra Austral · Prototipo 3D</title>
<style>
:root{--bg:#0d1a23;--panel:#14283a;--line:#2a4560;--gold:#f2b84b;--ink:#eef3f7;--muted:#9fb2c2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b1620;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.hud{position:fixed;left:0;right:0;z-index:5;pointer-events:none;padding:0 10px}
.top{top:calc(8px + env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.brand{text-shadow:0 2px 10px #000a}
.brand b{display:block;font:800 22px/1.1 Georgia,"Times New Roman",serif;letter-spacing:.3px}
.brand span{font-size:12px;color:#cfe0ec}
.pill{pointer-events:auto;background:#0d1a23d9;border:1px solid var(--line);border-radius:22px;color:var(--ink);font:600 13px/1 inherit;padding:9px 13px;min-height:38px;backdrop-filter:blur(6px)}
.seg{pointer-events:auto;display:flex;background:#0d1a23d9;border:1px solid var(--line);border-radius:22px;padding:3px;backdrop-filter:blur(6px)}
.seg button{border:0;background:transparent;color:var(--muted);font:600 13px/1 inherit;padding:9px 11px;border-radius:18px;min-height:34px}
.seg button.on{background:var(--gold);color:#241a05}
.row2{margin-top:8px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.bot{bottom:0;padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(#0d1a2300,#0d1a23e6 38%);padding-top:34px}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;pointer-events:auto}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 4px 5px;text-align:center;position:relative}
.chip i{display:block;width:34px;height:34px;margin:0 auto 1px;background-size:contain;background-repeat:no-repeat;background-position:center;filter:drop-shadow(0 2px 2px #0008)}
.chip b{display:block;font:800 19px/1 Georgia,serif}
.chip small{font-size:10px;color:var(--muted)}
.chip.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.16);border-color:var(--gold)}}
.act{display:flex;gap:8px;margin-top:9px;pointer-events:auto}
.btn{flex:1;min-height:52px;border-radius:14px;border:1px solid #6a4d12;background:linear-gradient(#f6c862,#d79a2b);color:#2a1d04;font:800 18px/1 Georgia,serif;letter-spacing:.3px;box-shadow:0 3px 0 #8a6215,0 8px 18px #0008}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #8a6215}
.btn:disabled{filter:grayscale(.6) brightness(.8)}
.btn.sec{flex:0 0 auto;padding:0 14px;background:var(--panel);color:var(--ink);border-color:var(--line);box-shadow:none;font:700 14px/1 inherit}
#toast{position:fixed;left:50%;top:34%;transform:translate(-50%,-10px);z-index:6;background:#0d1a23ee;border:1px solid var(--gold);border-radius:16px;padding:12px 18px;font:700 17px/1.25 Georgia,serif;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:88vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast small{display:block;font:500 12px/1.3 system-ui;color:var(--muted);margin-top:3px}
#hint{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:4;font-size:12px;color:#d7e4ee;background:#0d1a23b8;border-radius:14px;padding:6px 12px;pointer-events:none;white-space:nowrap;transition:opacity .6s}
#load{position:fixed;inset:0;z-index:20;background:#0b1620;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font:700 20px Georgia,serif;transition:opacity .6s}
#load small{font:500 13px system-ui;color:var(--muted)}
#load .bar{width:180px;height:5px;border-radius:3px;background:#1d3347;overflow:hidden}
#load .bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .2s}
#fps{position:fixed;left:8px;bottom:calc(170px + env(safe-area-inset-bottom));z-index:6;font:11px monospace;color:#9fe;display:none}
.fly{position:fixed;z-index:7;width:30px;height:30px;background-size:contain;background-repeat:no-repeat;background-position:center;pointer-events:none;box-shadow:0 0 12px 2px #fff8,inset 0 -3px 5px #0006;left:0;top:0}
.plus{position:fixed;z-index:7;pointer-events:none;font:800 18px Georgia,serif;text-shadow:0 2px 6px #000}
#tip{white-space:pre-line;text-align:center;max-width:240px;position:fixed;z-index:6;pointer-events:none;background:#0d1a23ee;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font:700 13px system-ui;transform:translate(-50%,-130%);opacity:0;transition:opacity .2s}
#tip.on{opacity:1}
</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js","three/addons/":"./vendor/"}}</script>

<body>
<canvas id="c" tabindex="-1"></canvas>
<div id="load"><div>Tierra Austral</div><div class="bar"><i id="lb"></i></div><small id="lt">Preparando la isla…</small></div>

<div class="hud top">
  <div class="brand"><b>Tierra Austral</b><span>Prototipo 3D · gráficos procedurales</span><button class="pill" id="isl" style="margin-top:8px;pointer-events:auto">🏝 Ver isla aparte</button></div>
  <div style="display:flex;flex-direction:column;gap:8px;align-items:flex-end">
    <button class="pill" id="q" aria-label="Calidad gráfica">Calidad: …</button>
    <div class="seg" id="tod" role="group" aria-label="Hora del día">
      <button data-t="amanecer">Alba</button><button data-t="dia" class="on">Día</button><button data-t="atardecer">Ocaso</button><button data-t="noche">Noche</button>
    </div>
  </div>
</div>
<div id="hint">Arrastra para girar · pellizca para acercar · toca un terreno</div>
<div id="fps"></div>
<div id="toast"></div>
<div id="tip"></div>
<div class="hud bot">
  <div class="chips" id="chips"></div>
  <div class="act"><button class="btn" id="roll" disabled>Tirar dados</button><button class="btn sec" id="cam">Centrar</button></div>
</div>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/OrbitControls.js';
import {RoundedBoxGeometry} from 'three/addons/RoundedBoxGeometry.js';

const $=s=>document.querySelector(s);
const DEBUG=/debug/.test(location.search);
const S=1,SQ3=Math.sqrt(3);
const COARSE=matchMedia('(pointer:coarse)').matches;
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- utilidades ---------- */
function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};}
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeOut=t=>1-Math.pow(1-t,3);
const hexCol=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mixc=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const frame=()=>new Promise(r=>requestAnimationFrame(()=>r()));
function setProgress(p,t){$('#lb').style.width=(p*100)+'%';if(t)$('#lt').textContent=t;}

/* ruido de valor + fbm */
function hash2(x,y,s){let h=Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+Math.imul(s|0,2147483647);h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296;}
function vnoise(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash2(xi,yi,s),b=hash2(xi+1,yi,s),c=hash2(xi,yi+1,s),d=hash2(xi+1,yi+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function fbm(x,y,o,s){let a=.5,f=1,t=0,n=0;for(let i=0;i<o;i++){t+=a*vnoise(x*f,y*f,s+i*17);n+=a;a*=.5;f*=2.03;}return t/n;}

/* ---------- mapa (el mismo trazado "Principiante" del juego) ---------- */
const BEGIN={'-2':['ore10','wool2','wood9'],'-1':['grain12','brick6','wood4','brick10'],'0':['wood9','ore11','desert','grain3','wool8'],'1':['wool8','brick3','grain4','ore5'],'2':['grain5','wood11','wool6']};
const TNAME={wood:'Bosque',brick:'Barrero',wool:'Pradera',grain:'Trigal',ore:'Cordillera',desert:'Pampa'};
const RNAME={wood:'Barraca',brick:'Adobe',wool:'Lana',grain:'Trigo',ore:'Metal'};
const RCOL={wood:'#4a9a57',brick:'#c86a47',wool:'#9ccf63',grain:'#e9c548',ore:'#7f93a8'};
const PCOL=['#ef6a5b','#4aa3ff','#8fd14f','#b78cff'];
const TOP={wool:.40,wood:.40,grain:.40,brick:.40,ore:.40,desert:.40},Y0=-.25,BEV=.035;
const ARCH=/[?&]islas/.test(location.search);
const tiles=[];
for(const r of [-2,-1,0,1,2]){const qmin=Math.max(-2,-2-r);BEGIN[r].forEach((s,i)=>{const m=/^([a-z]+)(\d*)$/.exec(s);const q=qmin+i;
  tiles.push({q,r,type:m[1],num:+m[2]||0,x:S*SQ3*(q+r/2),z:S*1.5*r,top:Y0+TOP[m[1]]+BEV,isle:0});});}
if(ARCH)for(const [q,r,tp,n] of [[4,-2,'wood',9],[5,-2,'ore',5],[5,-3,'wool',11],[4,-1,'grain',6],[5,-1,'brick',4]])tiles.push({q,r,type:tp,num:n,x:S*SQ3*(q+r/2),z:S*1.5*r,top:Y0+TOP[tp]+BEV,isle:1});
const corner=(t,i)=>{const a=Math.PI/180*(90+60*i);return[t.x+S*Math.cos(a),t.z-S*Math.sin(a)];};

/* ---------- renderer ---------- */
const canvas=$('#c');
let renderer;
try{renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});}
catch(e){$('#lt').textContent='Tu navegador no pudo iniciar gráficos 3D (WebGL).';throw e;}
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(36,1,.5,400);
const uTime={value:0};

/* ---------- luz, cielo y momentos del día ---------- */
const hemi=new THREE.HemisphereLight(0xffffff,0x445533,.9);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,2.6);sun.castShadow=true;
sun.shadow.camera.left=sun.shadow.camera.bottom=-7;sun.shadow.camera.right=sun.shadow.camera.top=7;sun.shadow.camera.near=1;sun.shadow.camera.far=60;
sun.shadow.bias=-.0006;sun.shadow.normalBias=.03;sun.shadow.radius=3;
scene.add(sun,sun.target);
const moon=new THREE.DirectionalLight(0x8fb4ff,0);scene.add(moon);

const TOD={
 dia:{sd:[.5,.8,.35],sun:'#fff1d6',si:2.7,hs:'#bfe3ff',hg:'#4a5a3a',hi:.95,top:'#2e7fc8',hor:'#cfe9f2',fog:'#cfe9f2',deep:'#0a5870',sh:'#3cc9b6',lamp:0},
 amanecer:{sd:[-.9,.26,.4],sun:'#ffc58a',si:2.3,hs:'#ffd9c2',hg:'#3d3a4a',hi:.75,top:'#4c63a8',hor:'#ffcf9f',fog:'#f2c9b0',deep:'#16506a',sh:'#62bcae',lamp:.15},
 atardecer:{sd:[.95,.2,-.2],sun:'#ff9448',si:2.5,hs:'#ffb98f',hg:'#2b2a3e',hi:.7,top:'#26346e',hor:'#ff8f5a',fog:'#e8946a',deep:'#12385a',sh:'#4aa59f',lamp:.5},
 noche:{sd:[-.3,.55,-.7],sun:'#7e9bd6',si:.55,hs:'#31456f',hg:'#0b1020',hi:.55,top:'#050a1c',hor:'#1b2a4d',fog:'#142040',deep:'#061a2e',sh:'#17566a',lamp:1.6}
};
const cur={sd:new THREE.Vector3(),sun:new THREE.Color(),si:0,hs:new THREE.Color(),hg:new THREE.Color(),hi:0,top:new THREE.Color(),hor:new THREE.Color(),fog:new THREE.Color(),deep:new THREE.Color(),sh:new THREE.Color(),lamp:0};
const lampMats=[];
function todSet(k,v){const P=TOD[k];cur.sd.set(...P.sd).normalize();for(const n of ['sun','hs','hg','top','hor','fog','deep','sh'])cur[n].set(P[n]);cur.si=P.si;cur.hi=P.hi;cur.lamp=P.lamp;applyTod();}
function applyTod(){
  sun.color.copy(cur.sun);sun.intensity=cur.si;sun.position.copy(cur.sd).multiplyScalar(22);
  hemi.color.copy(cur.hs);hemi.groundColor.copy(cur.hg);hemi.intensity=cur.hi;
  scene.fog.color.copy(cur.fog);
  moon.intensity=cur.lamp>1?.8:0;moon.position.set(-8,14,10);
  for(const m of lampMats)m.emissiveIntensity=cur.lamp;
  SKY.uniforms.uTop.value.copy(cur.top);SKY.uniforms.uHor.value.copy(cur.hor);SKY.uniforms.uSunDir.value.copy(cur.sd);SKY.uniforms.uSun.value.copy(cur.sun);
  WATER.uniforms.uDeep.value.copy(cur.deep);WATER.uniforms.uShallow.value.copy(cur.sh);WATER.uniforms.uFog.value.copy(cur.fog);WATER.uniforms.uSkyH.value.copy(cur.hor);
  WATER.uniforms.uSunDir.value.copy(cur.sd);WATER.uniforms.uSun.value.copy(cur.sun);
}
let todTween=null;
function todGo(name){
  if(todTween)todTween.stop=true;
  const P=TOD[name],from={sd:cur.sd.clone(),si:cur.si,hi:cur.hi,lamp:cur.lamp};const cf={};for(const n of ['sun','hs','hg','top','hor','fog','deep','sh'])cf[n]=cur[n].clone();
  const to={};for(const n of ['sun','hs','hg','top','hor','fog','deep','sh'])to[n]=new THREE.Color(P[n]);const sd=new THREE.Vector3(...P.sd).normalize();
  const tw={t:0,stop:false};todTween=tw;
  anims.push(dt=>{if(tw.stop)return true;tw.t=Math.min(1,tw.t+dt/1.4);const e=ease(tw.t);
    cur.sd.copy(from.sd).lerp(sd,e).normalize();cur.si=lerp(from.si,P.si,e);cur.hi=lerp(from.hi,P.hi,e);cur.lamp=lerp(from.lamp,P.lamp,e);
    for(const n in to)cur[n].copy(cf[n]).lerp(to[n],e);applyTod();return tw.t>=1;});
  document.querySelectorAll('#tod button').forEach(b=>b.classList.toggle('on',b.dataset.t===name));
}

const SKY=new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,
  uniforms:{uTop:{value:new THREE.Color()},uHor:{value:new THREE.Color()},uSunDir:{value:new THREE.Vector3(0,1,0)},uSun:{value:new THREE.Color()}},
  vertexShader:'varying vec3 vD;void main(){vD=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:`varying vec3 vD;uniform vec3 uTop,uHor,uSun,uSunDir;
   float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
   void main(){float y=clamp(vD.y,-.1,1.);vec3 c=mix(uHor,uTop,pow(clamp(y,0.,1.),.55));
    float s=max(dot(vD,normalize(uSunDir)),0.);c+=uSun*(pow(s,600.)*3.+pow(s,24.)*.25);
    float st=step(.9965,h(floor(vD.xz/(max(vD.y,.05))*70.)))*smoothstep(.15,.5,vD.y)*(1.-smoothstep(.2,.6,length(uHor)));c+=vec3(st);
    gl_FragColor=vec4(c,1.);
    #include <tonemapping_fragment>
    #include <colorspace_fragment>
   }`});
SKY.toneMapped=true;
const sky=new THREE.Mesh(new THREE.SphereGeometry(300,24,16),SKY);sky.renderOrder=-10;scene.add(sky);
scene.fog=new THREE.Fog(0xcfe9f2,30,120);

/* ---------- agua ---------- */
const MASK_HALF=ARCH?9.6:7.5;
const WATER=new THREE.ShaderMaterial({
  uniforms:{uTime,uMask:{value:null},uDeep:{value:new THREE.Color()},uShallow:{value:new THREE.Color()},uSun:{value:new THREE.Color()},uSunDir:{value:new THREE.Vector3(0,1,0)},uFog:{value:new THREE.Color()},uSkyH:{value:new THREE.Color()},uFogN:{value:30},uFogF:{value:120},uMH:{value:MASK_HALF},uLite:{value:0}},
  vertexShader:'varying vec3 vW;void main(){vec4 w=modelMatrix*vec4(position,1.);vW=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}',
  fragmentShader:`precision highp float;
   uniform float uTime,uFogN,uFogF,uMH,uLite;uniform sampler2D uMask;uniform vec3 uDeep,uShallow,uSun,uSunDir,uFog,uSkyH;varying vec3 vW;
   float hs(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
   float nz(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hs(i),hs(i+vec2(1,0)),f.x),mix(hs(i+vec2(0,1)),hs(i+vec2(1,1)),f.x),f.y);}
   float hgt(vec2 p){float t=uTime;
    float h=sin(p.x*1.1+t*.8+nz(p*.4)*3.)*.5+sin(p.y*1.4-t*.6+p.x*.5)*.35;
    h+=nz(p*2.2+vec2(t*.35,-t*.25))*.5+nz(p*5.1-vec2(t*.5,t*.3))*.22*(1.-uLite);return h;}
   void main(){
    vec2 p=vW.xz;float e=.06;
    float h0=hgt(p),hx=hgt(p+vec2(e,0.)),hz=hgt(p+vec2(0.,e));
    vec3 N=normalize(vec3(-(hx-h0)/e*.16,1.,-(hz-h0)/e*.16));
    vec3 V=normalize(cameraPosition-vW);
    vec2 uv=(p+uMH)/(2.*uMH);vec2 m=vec2(0.);
    if(uv.x>0.&&uv.x<1.&&uv.y>0.&&uv.y<1.)m=texture2D(uMask,uv).rg;
    float shal=smoothstep(.05,.9,m.g)*.85;
    vec3 col=mix(uDeep,uShallow,pow(shal,.8));
    float far=smoothstep(8.,40.,length(p));col=mix(col,uDeep*.7,far*.6);
    // caustica suave en la orilla
    float ca=nz(p*7.+vec2(uTime*.6,uTime*.4))*nz(p*9.-vec2(uTime*.5,0.));col+=uSun*ca*.22*shal*(1.-uLite);
    // espuma pegada a la costa
    float fn=nz(p*5.5+vec2(uTime*.5,-uTime*.35));
    float band=smoothstep(.20,.34,m.r)*(1.-smoothstep(.34,.62,m.r));
    float foam=band*smoothstep(.35,.7,fn+sin(uTime*1.1+m.r*18.)*.18);
    foam+=smoothstep(.62,.5,m.r)*smoothstep(.34,.5,m.r)*.55;
    col=mix(col,vec3(.94,.98,1.),clamp(foam,0.,1.)*.7);
    // reflejo y brillo del sol
    float fr=pow(1.-max(dot(N,V),0.),4.);col=mix(col,uSkyH,fr*.6);
    vec3 L=normalize(uSunDir);vec3 H=normalize(V+L);float sp=pow(max(dot(N,H),0.),140.);col+=uSun*sp*1.3*min(1.,dot(uSun,vec3(.6)));
    // sombra bajo los acantilados
    col*=1.-smoothstep(.5,.78,m.r)*.35;
    float d=length(vW-cameraPosition);col=mix(col,uFog,smoothstep(uFogN,uFogF,d));
    gl_FragColor=vec4(col,1.);
    #include <tonemapping_fragment>
    #include <colorspace_fragment>
   }`});
const water=new THREE.Mesh(new THREE.PlaneGeometry(500,500,1,1),WATER);water.rotation.x=-Math.PI/2;scene.add(water);

function buildMask(){
  const N=512,c=document.createElement('canvas');c.width=c.height=N;const x=c.getContext('2d');x.fillStyle='#000';x.fillRect(0,0,N,N);x.fillStyle='#fff';
  const k=N/(2*MASK_HALF);
  for(const t of tiles){x.beginPath();for(let i=0;i<6;i++){const [cx,cz]=corner(t,i);const px=(cx+MASK_HALF)*k,py=(cz+MASK_HALF)*k;i?x.lineTo(px,py):x.moveTo(px,py);}x.closePath();x.fill();}
  const d=x.getImageData(0,0,N,N).data,src=new Float32Array(N*N);for(let i=0;i<N*N;i++)src[i]=d[i*4]/255;
  const blur=(a,r)=>{const t=new Float32Array(N*N),o=new Float32Array(N*N),kk=2*r+1;
    for(let y=0;y<N;y++){let s=0;for(let q=-r;q<=r;q++)s+=a[y*N+clamp(q,0,N-1)];for(let q=0;q<N;q++){t[y*N+q]=s/kk;s+=a[y*N+Math.min(N-1,q+r+1)]-a[y*N+Math.max(0,q-r)];}}

  let a=blur(blur(src,3),3),b=blur(blur(blur(src,16),16),16);

  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),.05);uTime.value+=dt;
  for(let i=anims.length-1;i>=0;i--)if(anims[i](dt))anims.splice(i,1);
  const T=uTime.value;
  for(const b of boats){const u=b.userData;const a=u.a+T*u.sp;b.position.set(Math.cos(a)*u.r,Math.sin(T*1.3+u.ph)*.03+.0,Math.sin(a)*u.r*.9);b.rotation.y=-a-Math.PI/2;b.rotation.z=Math.sin(T*1.1+u.ph)*.05;b.rotation.x=Math.sin(T*.9+u.ph)*.04;}
  for(const m of moored){const u=m.userData;m.position.y=u.base.y+Math.sin(T*1.3+u.ph)*(u.buoy?.03:.022);m.rotation.z=Math.sin(T*1.1+u.ph)*(u.buoy?.1:.04);m.rotation.x=Math.sin(T*.9+u.ph)*(u.buoy?.1:.03);}
  if(diceRaft){diceRaft.position.y=Math.sin(T*1.2)*.018;diceRaft.rotation.z=Math.sin(T*.9)*.012;}
  for(const f of flags){f.rotation.y=Math.sin(T*3.2+f.position.x*9)*.35;f.scale.x=.9+Math.sin(T*4.1)*.08;}
  if(robber&&!rolling)robber.rotation.y=Math.sin(T*.7)*.25;
  if(intro){intro.t=Math.min(1,intro.t+dt/(REDUCED||/nointro/.test(location.search)?.01:2.6));const e=ease(intro.t);camPlace(lerp(fit*1.55,fit,e),lerp(.55,.9,e),lerp(.5,0,e));if(intro.t>=1){intro=null;controls.enabled=true;$('#roll').disabled=false;camPlace(fit,.9,0);controls.update();}}
  else if(!window.__free)controls.update();
  sky.position.copy(camera.position);
  renderer.render(scene,camera);
  frames++;
  if(fpsOn&&frames>40&&!intro){fpsAvg=lerp(fpsAvg,1/Math.max(dt,.001),.05);
    if(fpsAvg<28&&Q>0){lowCount++;if(lowCount>50){applyQuality(Q-1);lowCount=0;fpsAvg=45;toast('Ajusté la calidad para que se mueva fluido<small>Puedes cambiarla arriba a la derecha</small>',2400);}}else lowCount=0;
    if(DEBUG)$('#fps').textContent=fpsAvg.toFixed(0)+' fps · '+QN[Q]+' · '+renderer.info.render.triangles+' tri';}
}

/* ---------- arranque ---------- */
(async()=>{
  try{
    resize();
    applyQuality(COARSE||(devicePixelRatio>=2&&(navigator.hardwareConcurrency||8)<=6)?1:2);
    todSet('dia');
    buildChips();
    await buildIsland();
    setProgress(.95,'Último ajuste de luces…');await sleep(30);
    todSet('dia');
    controls.enabled=false;intro={t:0};camPlace(fit*1.55,.55,.5);
    for(let i=0;i<2;i++){renderer.render(scene,camera);await frame();}
    setProgress(1);const L=$('#load');L.style.opacity=0;setTimeout(()=>L.remove(),700);
    setTimeout(()=>{$('#hint').style.opacity=0;},9000);
    loop();
  }catch(e){console.error(e);$('#lt').textContent='Ocurrió un problema al preparar la escena: '+(e&&e.message||e);}
})();
document.querySelectorAll('#tod button').forEach(b=>b.onclick=()=>todGo(b.dataset.t));
$('#isl').textContent=ARCH?'🏝 Volver a una isla':'🏝 Ver isla aparte';
$('#isl').onclick=()=>{location.href=location.pathname+(ARCH?'':'?islas=1');};
$('#roll').onclick=()=>roll();
$('#cam').onclick=()=>{const from=camera.position.clone(),tg=controls.target.clone();const sph=new THREE.Spherical().setFromVector3(from.clone().sub(tg));const tgt={r:fit,p:.9,t:0};
  controls.enabled=false;tween(.8,u=>{const e=ease(u);camPlace(lerp(sph.radius,tgt.r,e),lerp(sph.phi,tgt.p,e),lerp(sph.theta,tgt.t,e));},()=>{controls.enabled=true;controls.update();});};
window.TA3D={get robber(){return robber;},piers,boats,roll,todGo,applyQuality,get q(){return Q;},tiles,buildings,camera,controls};
</script>
